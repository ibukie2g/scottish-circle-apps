<script>
/*
 * 運営画面のスクリプト(サーバーとのやりとりは docs/API.md の関数だけ)
 * - 下のタブ5つ:進行 / 試合 / 順位 / クイズ / 名簿
 * - トークンは sessionStorage に置く。AUTH が返ったらログイン画面に戻す
 * - 保存中は「保存中…」、成功で「保存しました」、失敗は理由(通信の失敗は「もう一度送る」)
 * - 返事が30秒来ないときは「結果を確かめてください」と出し、最新の状態を取り直す(保存されていないと決めつけない)
 */
(function () {
  'use strict';

  var TEAMS = ['A', 'B', 'C', 'D'];
  var TEAM_MARK = { A: '🔴', B: '🔵', C: '🟡', D: '🟢' };
  var TEAM_COLOR = { A: '赤', B: '青', C: '黄', D: '緑' };
  var SPORTS = [
    { key: 'バスケ', icon: '🏀' },
    { key: 'バド', icon: '🏸' },
    { key: 'ドッジ', icon: '🤾' },
    { key: 'バレー', icon: '🏐' }
  ];
  // 「今の種目・次の種目」の候補(当日の流れの順)
  var EVENTS = ['バスケ', 'バド+ドッジ', 'バレー', 'クイズ', '結果発表'];
  var MODE_TEXT = {
    '待ち': '待ち画面(種目と運動の点数)',
    '予想': 'バレーの勝敗予想',
    'クイズ': 'クイズ中',
    '結果待ち': 'クイズ終了・結果発表を待つ',
    '結果公開': '結果を全員に公開中'
  };
  var TAB_TITLE = { progress: '進行', matches: '試合', scores: '順位', quiz: 'クイズ', roster: '名簿' };
  var PREFS = ['北海道', '青森県', '岩手県', '宮城県', '秋田県', '山形県', '福島県', '茨城県', '栃木県', '群馬県', '埼玉県', '千葉県',
    '東京都', '神奈川県', '新潟県', '富山県', '石川県', '福井県', '山梨県', '長野県', '岐阜県', '静岡県', '愛知県', '三重県',
    '滋賀県', '京都府', '大阪府', '兵庫県', '奈良県', '和歌山県', '鳥取県', '島根県', '岡山県', '広島県', '山口県', '徳島県',
    '香川県', '愛媛県', '高知県', '福岡県', '佐賀県', '長崎県', '熊本県', '大分県', '宮崎県', '鹿児島県', '沖縄県'];
  var TOKEN_KEY = 'sportsDayAdminToken';

  // 画面の状態
  var S = {
    token: '',
    ov: null,            // adminGetOverview の data
    offset: 0,           // サーバー時刻 - 端末の時刻
    tab: 'progress',
    sport: null,         // 試合タブで開いている種目
    drafts: {},          // 試合ID → { s1, s2 }(入力中の点数)
    basket: null,        // ラウンドごとの前半・クイズバスケの入力
    pred: {},            // 試合ID → adminGetPredictionSummary の data
    ev: null,            // 種目の入力中 { cur, next }
    scores: null,        // adminGetScores の data
    scoreView: 'sports', // 'sports'(運動だけ) | 'total'(仲良し込み)
    scoreOrder: 'up',    // 'up' = 4位から | 'down' = 1位から
    quizStatus: null,
    near: null,          // adminListNearMisses の items(同じ答えはまとめてある)
    nearPending: 0,      // 未判断の件数
    nearCand: {},        // 判断の一覧で選び直した候補(番号の並び → 参加者ID)
    showJudged: false,
    odai: null,
    odaiNo: 1,
    odaiDraft: {},       // お題番号 → { theme, teams: { A: { matched, answered } } }
    rosterFilter: 'all',
    rosterQuery: '',
    openPerson: null,
    walkTeam: '',
    lastImport: null,
    settingsDraft: {},
    openDetails: {}      // <details> の data-key → 開いているか
  };

  // ============ 小さな道具 ============
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function ssGet(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function ssSet(k, v) { try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch (e) { /* 使えない端末は覚えない */ } }
  function now() { return Date.now() + S.offset; }
  function fmt1(n) {
    if (n === null || n === undefined || n === '') return '-';
    var x = Math.round(Number(n) * 10) / 10;
    return String(x);
  }
  function pct(n) { return n === null || n === undefined ? '-' : fmt1(n) + '%'; }
  function teamChip(t, lg) {
    if (!t) return '<span class="team none' + (lg ? ' lg' : '') + '">?</span>';
    return '<span class="team ' + esc(t) + (lg ? ' lg' : '') + '">' + esc(t) + '</span>';
  }
  function clock(ms) {
    if (ms === null || ms === undefined) return '-';
    var d = new Date(ms);
    return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function mmss(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2);
  }
  function setting(key, def) {
    var rows = (S.ov && S.ov.settings) || [];
    for (var i = 0; i < rows.length; i++) if (rows[i].key === key) {
      var n = Number(rows[i].value);
      return isNaN(n) ? def : n;
    }
    return def;
  }
  function matchById(id) {
    var ms = (S.ov && S.ov.matches) || [];
    for (var i = 0; i < ms.length; i++) if (ms[i].id === id) return ms[i];
    return null;
  }
  function personById(id) {
    var ps = (S.ov && S.ov.participants) || [];
    for (var i = 0; i < ps.length; i++) if (ps[i].id === id) return ps[i];
    return null;
  }
  function matchLabel(m) { return m ? m.sport + ' ' + m.round : ''; }
  /** 開いた <details> を書き直しのあとも開いたままにする */
  function det(key, style) {
    return '<details data-key="' + esc(key) + '"' + (style ? ' style="' + style + '"' : '') + (S.openDetails[key] ? ' open' : '') + '>';
  }
  function inputFocused() {
    var a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA') && a.closest('main'));
  }

  // ============ 保存中などの表示 ============
  var statusTimer = null;
  /**
   * 上に出すお知らせ。kind = saving / ok / err
   * retry = 関数(「もう一度送る」ボタン)か、{ label, fn }(ボタンの文字を変えるとき。例:「最新の状態を確かめる」)
   */
  function showStatus(kind, msg, retry) {
    var el = $('status');
    clearTimeout(statusTimer);
    var act = typeof retry === 'function' ? { label: 'もう一度送る', fn: retry } : retry;
    el.className = 'status ' + kind;
    el.innerHTML = '<span class="msg">' + esc(msg) + '</span>' +
      (act ? '<button type="button" data-st="retry">' + esc(act.label) + '</button>' : '') +
      (kind === 'err' ? '<button type="button" data-st="close" aria-label="閉じる">✕</button>' : '');
    el.onclick = function (e) {
      var b = e.target.closest('[data-st]');
      if (!b) return;
      hideStatus();
      if (b.getAttribute('data-st') === 'retry' && act) act.fn();
    };
    if (kind === 'ok') statusTimer = setTimeout(hideStatus, 1800);
    if (kind === 'err' && !act) statusTimer = setTimeout(hideStatus, 6000);
  }
  function hideStatus() { $('status').className = 'status hidden'; }

  // ============ 確認(1回だけ) ============
  function confirmBox(title, body, okLabel, onOk, danger) {
    var m = $('modal');
    m.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
      '<h3>' + esc(title) + '</h3><div class="body">' + esc(body) + '</div>' +
      '<div class="row"><button class="btn ghost grow" data-m="cancel">やめる</button>' +
      '<button class="btn grow ' + (danger ? 'ng' : 'accent') + '" data-m="ok">' + esc(okLabel) + '</button></div></div>';
    m.className = 'modal-bg';
    m.onclick = function (e) {
      var b = e.target.closest('[data-m]');
      if (!b && e.target !== m) return;
      m.className = 'modal-bg hidden';
      m.innerHTML = '';
      if (b && b.getAttribute('data-m') === 'ok') onOk();
    };
  }

  // ============ サーバー呼び出し ============
  /**
   * 運営用の関数を呼ぶ(第1引数にトークンを足す)
   * opt: { save: '保存中…の文言' | true, ok: '成功の文言', onOk(data), onErr(err), btn: 押したボタン }
   */
  function api(fn, args, opt) {
    callRaw(fn, [S.token].concat(args || []), opt || {});
  }
  var CALL_TIMEOUT_MS = 30000;
  function callRaw(fn, args, opt) {
    var saving = !!opt.save;
    if (saving) showStatus('saving', typeof opt.save === 'string' ? opt.save : '保存中…');
    if (opt.btn) opt.btn.disabled = true;
    var done = function () { if (opt.btn) opt.btn.disabled = false; };
    if (!window.google || !google.script || !google.script.run) {
      done();
      showStatus('err', 'この画面は Apps Script の Webアプリとして開いてください');
      return;
    }
    /* 「最新の状態を確かめる」:いまのタブを取り直す(ログイン前は何もしない) */
    var check = { label: '最新の状態を確かめる', fn: opt.check || function () { if (S.token) refreshTab(true); } };
    /* やり直すと結果が変わる操作(クイズ開始は開始時刻が変わる)は、もう一度送らせず、まず状態を確かめる */
    var again = opt.noRetry ? check : function () { callRaw(fn, args, opt); };
    var timedOut = false, settled = false;
    var timer = setTimeout(function () {
      if (settled) return;
      timedOut = true;
      done();
      /* 返事が来ないだけで、サーバーでは終わっているかもしれない。「保存されていない」とは決めつけない */
      showStatus('err', saving ? '返事が届きません。保存できたかどうか、結果を確かめてください' : '返事が届きません。電波を確かめて、もう一度読み込んでください', check);
      if (opt.onErr) opt.onErr({ code: 'TIMEOUT' });
    }, opt.timeout || CALL_TIMEOUT_MS);
    var runner = google.script.run
      .withSuccessHandler(function (res) {
        settled = true;
        clearTimeout(timer);
        if (timedOut) {
          /* 時間切れのあとに返事が届いた:古い返事で画面を書き換えず、最新の状態を取り直す */
          if (res && res.ok && saving) showStatus('ok', '遅れて返事が届きました。最新の状態にします');
          if (S.token) refreshTab(true);
          return;
        }
        done();
        if (!res || typeof res !== 'object') {
          showStatus('err', 'サーバーから正しい返事がありませんでした', again);
          if (opt.onErr) opt.onErr({ code: 'INTERNAL' });
          return;
        }
        if (res.ok) {
          if (saving) showStatus('ok', opt.ok || '保存しました');
          if (opt.onOk) opt.onOk(res.data);
          return;
        }
        var e = res.error || {};
        if (e.code === 'AUTH' && fn !== 'adminLogin') { toLogin('ログインの期限が切れました。もう一度パスワードを入れてください'); return; }
        var canRetry = e.code === 'BUSY' || e.code === 'INTERNAL';
        if (e.code === 'BUSY') e.message = (e.message || '') + '(混んでいます。少し待ってもう一度)';
        if (e.code === 'SETUP') e.message = '設定が終わっていません:' + (e.message || '');
        showStatus('err', e.message || 'うまくいきませんでした', canRetry ? again : null);
        if (opt.onErr) opt.onErr(e);
      })
      .withFailureHandler(function (err) {
        settled = true;
        clearTimeout(timer);
        if (timedOut) return;
        done();
        showStatus('err', opt.noRetry ? '通信できませんでした。処理できたかどうか、まず最新の状態を確かめてください' : '通信できませんでした。電波を確かめてください', again);
        if (opt.onErr) opt.onErr({ code: 'NETWORK', message: String(err && err.message || err) });
      });
    runner[fn].apply(runner, args);
  }

  // ============ ログイン ============
  function toLogin(msg) {
    S.token = '';
    ssSet(TOKEN_KEY, '');
    $('app').className = 'hidden';
    $('login').className = 'login';
    $('loginMsg').textContent = msg || '';
    hideStatus();
  }
  function toApp() {
    $('login').className = 'login hidden';
    $('app').className = '';
    switchTab(S.tab);
  }
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value;
    if (!pw) return;
    $('loginMsg').textContent = '';
    callRaw('adminLogin', [pw], {
      btn: $('loginBtn'),
      onOk: function (d) {
        S.token = d.token;
        ssSet(TOKEN_KEY, d.token);
        $('pw').value = '';
        toApp();
      },
      onErr: function (er) { if (er && er.code === 'AUTH') { hideStatus(); $('loginMsg').textContent = er.message || 'パスワードが違います'; } }
    });
  });

  // ============ 一覧の取得 ============
  function loadOverview(after) {
    api('adminGetOverview', [], {
      onOk: function (d) {
        S.ov = d;
        S.offset = (d.serverNow || Date.now()) - Date.now();
        updateHeader();
        if (after) after();
      }
    });
  }
  function updateHeader() {
    var st = S.ov && S.ov.state;
    $('modePill').textContent = st ? '📱 ' + st.mode : '-';
    $('topTitle').textContent = TAB_TITLE[S.tab];
    var n = S.ov ? S.ov.pendingNearMisses : 0;
    var dot = $('nearDot');
    dot.textContent = n;
    dot.className = n > 0 ? 'dot' : 'dot hidden';
  }

  // ============ タブ ============
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) switchTab(b.getAttribute('data-tab'));
  });
  $('reloadBtn').addEventListener('click', function () { refreshTab(true); });

  function switchTab(tab) {
    S.tab = tab;
    if ($('status').className.indexOf('saving') < 0) hideStatus();
    var bs = document.querySelectorAll('#tabs button');
    for (var i = 0; i < bs.length; i++) bs[i].className = bs[i].getAttribute('data-tab') === tab ? 'on' : '';
    Object.keys(TAB_TITLE).forEach(function (t) { $('tab-' + t).className = t === tab ? 'tab' : 'tab hidden'; });
    updateHeader();
    window.scrollTo(0, 0);
    if (S.ov) render();
    refreshTab(true);
  }

  /** タブを開いたとき・↻・定期的に、最新を取り直す */
  function refreshTab(force) {
    var tab = S.tab;
    loadOverview(function () {
      if (tab !== S.tab) return;
      if (tab === 'scores') { loadScores(); return; }
      if (tab === 'quiz') { loadQuiz(force); return; }
      loadPredSummaries();
      safeRender();
    });
  }
  function safeRender() { if (!inputFocused()) render(); }
  function render() {
    updateHeader();
    if (!S.ov) return;
    ({ progress: renderProgress, matches: renderMatches, scores: renderScores, quiz: renderQuiz, roster: renderRoster })[S.tab]();
  }

  // 定期的な取り直し(進行・クイズのタブだけ。入力中は画面を書き換えない)
  setInterval(function () {
    if (document.hidden || !S.token || $('app').className === 'hidden') return;
    if (S.tab === 'progress' || S.tab === 'quiz') refreshTab(false);
    else if (S.tab === 'matches') loadPredSummaries();
  }, 12000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && S.token && $('app').className !== 'hidden') refreshTab(false);
  });
  // クイズの残り時間(1秒ごと。画面全体は書き換えない)
  setInterval(function () {
    var els = document.querySelectorAll('[data-clock]');
    for (var i = 0; i < els.length; i++) els[i].textContent = quizClockText();
    /* 予想の受付を始めてからの経過時間 */
    var es = document.querySelectorAll('[data-elapsed]');
    for (var k = 0; k < es.length; k++) es[k].textContent = elapsedText(es[k].getAttribute('data-elapsed'));
  }, 1000);

  // ============ 画面の中の操作(まとめて受ける) ============
  var ACTIONS = {};
  document.querySelector('main').addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el, e);
  });
  document.querySelector('main').addEventListener('input', function (e) {
    var el = e.target;
    var k = el.getAttribute('data-in');
    if (k && INPUTS[k]) INPUTS[k](el);
  });
  document.querySelector('main').addEventListener('focusin', function (e) {
    if (e.target.classList && (e.target.classList.contains('score') || e.target.classList.contains('num'))) {
      try { e.target.select(); } catch (er) { /* 選べない入力欄もある */ }
    }
  });
  document.querySelector('main').addEventListener('change', function (e) {
    var el = e.target;
    var k = el.getAttribute('data-chg');
    if (k && CHANGES[k]) CHANGES[k](el);
  });
  var INPUTS = {};
  var CHANGES = {};
  document.querySelector('main').addEventListener('toggle', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-key');
    if (k) S.openDetails[k] = e.target.open;
  }, true);

  // ================================================================
  // 進行タブ
  // ================================================================
  function renderProgress() {
    var st = S.ov.state;
    if (!S.ev) S.ev = { cur: st.currentEvent, next: st.nextEvent };
    var h = '';

    // 参加者の画面
    h += '<div class="card"><h2>📱 参加者の画面<span class="right">' + (st.updatedAt ? clock(st.updatedAt) + ' 更新' : '') + '</span></h2>';
    h += '<div class="center" style="margin:4px 0 12px"><div class="big-num">' + esc(st.mode) + '</div><div class="sub">' + esc(MODE_TEXT[st.mode] || '') + '</div></div>';
    h += '<div class="seg c3">';
    (st.modes || Object.keys(MODE_TEXT)).forEach(function (md) {
      h += '<button data-act="mode" data-mode="' + esc(md) + '" class="' + (md === st.mode ? 'on' : '') + '">' + esc(md) + '</button>';
    });
    h += '</div>';
    h += '<p class="sub" style="margin:8px 0 0">「クイズ」と「結果公開」は確認が出ます。予想は試合タブのバレーから始めるのがかんたんです。</p>';
    h += '</div>';

    // 種目
    h += '<div class="card"><h2>📣 種目(待ち画面に出す)</h2>';
    h += eventPicker('cur', '今の種目', S.ev.cur) + eventPicker('next', '次の種目', S.ev.next);
    var changed = S.ev.cur !== st.currentEvent || S.ev.next !== st.nextEvent;
    h += '<div class="row" style="margin-top:12px">';
    h += '<button class="btn ghost grow" data-act="evAdvance">▶ 次の種目へ進める</button>';
    h += '<button class="btn accent grow" data-act="evSave"' + (changed ? '' : ' disabled') + '>保存</button></div>';
    h += '<p class="sub" style="margin:6px 0 0">いま:' + esc(st.currentEvent || '(なし)') + ' → 次:' + esc(st.nextEvent || '(なし)') + '</p>';
    h += '</div>';

    // 予想
    var pm = st.predictionMatchId ? matchById(st.predictionMatchId) : null;
    if (pm) {
      h += '<div class="card"><h2>🏐 勝敗予想<span class="right">' + esc(pm.id) + '</span></h2>';
      h += predBlock(pm, true);
      h += '</div>';
    }

    // クイズ
    h += '<div class="card"><h2>💡 クイズ</h2>' + quizControl() + '</div>';

    // 結果発表
    h += '<div class="card"><h2>🏆 結果発表</h2>';
    h += '<p class="sub" style="margin:0 0 10px">順位タブで「運動だけ」→「仲良しポイント込み」の順に読み上げてから、公開を押します。</p>';
    h += '<div class="row"><button class="btn ghost grow" data-act="goScores">順位を見る</button>';
    h += '<button class="btn ng grow" data-act="publish"' + (st.mode === '結果公開' ? ' disabled' : '') + '>' + (st.mode === '結果公開' ? '公開済み' : '結果を全員に公開') + '</button></div>';
    h += '</div>';

    // 設定
    h += '<div class="card">' + det('settings') + '<summary>⚙️ 配点・制限時間の設定</summary>' + settingsForm() + '</details></div>';

    h += '<div class="center"><button class="link-btn" data-act="logout">ログアウト</button></div>';
    $('tab-progress').innerHTML = h;
  }

  function eventPicker(key, label, val) {
    var h = '<label class="f">' + label + '</label>';
    h += '<div class="chips">';
    EVENTS.forEach(function (ev) {
      h += '<button class="chip' + (ev === val ? ' on' : '') + '" data-act="evPick" data-k="' + key + '" data-v="' + esc(ev) + '">' + esc(ev) + '</button>';
    });
    h += '<button class="chip' + (val === '' ? ' on' : '') + '" data-act="evPick" data-k="' + key + '" data-v="">なし</button>';
    h += '</div>';
    h += '<input class="t" style="margin-top:6px" data-in="ev" data-k="' + key + '" value="' + esc(val) + '" placeholder="自由に書いてもOK">';
    return h;
  }
  ACTIONS.evPick = function (el) {
    S.ev[el.getAttribute('data-k')] = el.getAttribute('data-v');
    renderProgress();
  };
  INPUTS.ev = function (el) {
    S.ev[el.getAttribute('data-k')] = el.value;
    var st = S.ov.state;
    var b = document.querySelector('[data-act="evSave"]');
    if (b) b.disabled = S.ev.cur === st.currentEvent && S.ev.next === st.nextEvent;
  };
  ACTIONS.evAdvance = function () {
    var st = S.ov.state;

  ACTIONS.evSave = function (el) {

  ACTIONS.mode = function (el) {
    var md = el.getAttribute('data-mode');

    if (md === st.mode && md !== 'クイズ') return;
    if (md === 'クイズ') { confirmQuizStart(false); return; }

    if (md === '予想' && !st.predictionMatchId) {

    });
  }
  ACTIONS.setMode = function (el) { setMode(el.getAttribute('data-mode'), el); };
  ACTIONS.goScores = function () { S.scoreView = 'sports'; switchTab('scores'); };
  ACTIONS.logout = function () {
    confirmBox('ログアウトしますか？', 'もう一度パスワードを入れると戻れます。', 'ログアウト', function () { toLogin(''); });
  };

  /* 公開の前に、入力もれがないか数を出す(足りなくても公開は止めない。P1-4) */

    var ms = S.ov.matches || [];
    var parts = S.ov.participants || [];
    var done = ms.filter(function (m) { return m.status === '確定'; }).length;
    var arrived = parts.filter(function (p) { return p.arrivedAt; }).length;
    var answered = parts.filter(function (p) { return p.quizAnswered; }).length;
    var pending = S.ov.pendingNearMisses || 0;
    var odai = S.ov.odaiCount || 0;
    var body = '全員のスマホに総合結果(仲良しポイントの内訳も)が出ます。読み上げが終わってから押してください。\n\n' +
      (done < ms.length ? '⚠️ ' : '✓ ') + '試合の確定 ' + done + ' / ' + ms.length + '\n' +
      (odai < 12 ? '⚠️ ' : '✓ ') + 'お題カードの入力 ' + odai + ' / 12\n' +
      (answered < arrived ? '⚠️ ' : '✓ ') + 'クイズの回答 ' + answered + '人 / 来場 ' + arrived + '人\n' +
      (pending ? '⚠️ ' : '✓ ') + 'まだ判断していない答え ' + pending + '件' +
      (pending ? '(このまま公開すると×の扱いになります。公開のあとでも直せます)' : '') +
      '\n\n足りないものがあっても公開できます。';
    confirmBox('結果を全員に公開しますか？', body, '公開する', function () {
      api('adminPublishResults', [], {

  // ---- クイズの操作(進行タブとクイズタブで共通) ----
  function quizClockText() {
    var q = S.ov && S.ov.state && S.ov.state.quiz;
    if (!q) return '';
    var t = now();
    if (t < q.nameEndsAt) return '名前の問題 残り ' + mmss((q.nameEndsAt - t) / 1000);
    if (t < q.originEndsAt) return '出身地の問題 残り ' + mmss((q.originEndsAt - t) / 1000);
    return '時間終了(' + clock(q.originEndsAt) + ')';
  }
  function quizControl() {
    var st = S.ov.state;
    var parts = S.ov.participants || [];
    var arrived = parts.filter(function (p) { return p.arrivedAt; }).length;
    var answered = parts.filter(function (p) { return p.quizAnswered; }).length;
    var h = '';
    if (st.quiz) {
      h += '<p style="margin:0 0 6px">開始 ' + clock(st.quiz.startedAt) + '・<b data-clock>' + esc(quizClockText()) + '</b></p>';
    } else {
      h += '<p class="sub" style="margin:0 0 6px">まだ始めていません</p>';
    }
    h += '<p style="margin:0 0 10px">回答 <b style="font-size:22px">' + answered + '</b> 人 / 来場 ' + arrived + ' 人</p>';
    h += '<button class="btn block big accent" data-act="quizStart">' + (st.quizStartedAt ? '🔁 クイズをやり直す(開始時刻を今に)' : '▶ クイズ開始') + '</button>';
    if (st.mode === 'クイズ') {
      h += '<div style="height:8px"></div><button class="btn block ghost" data-act="setMode" data-mode="結果待ち">クイズ終了 → 「結果待ち」にする</button>';
    }
    h += det('regen', 'margin-top:8px') + '<summary>チームを変えたあとに始めるとき</summary>' +
      '<p class="sub">まだ答えていない人の問題を、今のチームで作り直してから開始します。</p>' +
      '<button class="btn block ghost" data-act="quizRegen">問題を作り直して開始</button></details>';
    return h;
  }
  function confirmQuizStart(regen) {
    var st = S.ov.state;
    var parts = S.ov.participants || [];
    var arrived = parts.filter(function (p) { return p.arrivedAt; }).length;
    var body = '全員のスマホがクイズ画面になり、名前 ' + setting('クイズ:名前の制限時間(秒)', 120) + '秒 → 出身地 ' +
      setting('クイズ:出身地の制限時間(秒)', 60) + '秒(3問)が始まります。\n来場 ' + arrived + '人 / 名簿 ' + parts.length + '人。スマホがない人は、先に名簿タブで「来場にする」を押してください。';
    if (st.quizStartedAt) body = 'すでに ' + clock(st.quizStartedAt) + ' に開始しています。開始時刻を今にしてやり直します。\n' + body;
    if (regen) body = 'まだ答えていない人の問題を作り直します。\n' + body;
    confirmBox(regen ? '問題を作り直して開始しますか？' : 'クイズを開始しますか？', body, '開始する', function () {
      api('adminStartQuiz', regen ? [{ regenerate: true }] : [], {
        save: 'クイズを準備中…', ok: 'クイズを開始しました', noRetry: true,
        onOk: function (d) {
          S.ov.state = d.state;
          showStatus('ok', 'クイズを開始しました(問題 ' + d.generated + '人分を作成)');
          render();
        }
      });
    }, true);
  }
  ACTIONS.quizStart = function () { confirmQuizStart(false); };
  ACTIONS.quizRegen = function () { confirmQuizStart(true); };

  // ================================================================
  // 試合タブ
  // ================================================================
  function sportOfEvent(ev) {
    if (!ev) return null;
    if (ev.indexOf('バスケ') >= 0) return 'バスケ';
    if (ev.indexOf('バド') >= 0) return 'バド';
    if (ev.indexOf('ドッジ') >= 0) return 'ドッジ';
    if (ev.indexOf('バレー') >= 0) return 'バレー';
    return null;
  }
  function renderMatches() {
    var ms = S.ov.matches || [];
    if (!S.sport) S.sport = sportOfEvent(S.ov.state.currentEvent) || firstOpenSport(ms);
    var h = '<div class="seg c4" style="margin-bottom:12px">';
    SPORTS.forEach(function (sp) {
      var list = ms.filter(function (m) { return m.sport === sp.key; });
      var done = list.filter(function (m) { return m.status === '確定'; }).length;
      h += '<button data-act="sport" data-v="' + sp.key + '" class="' + (sp.key === S.sport ? 'on' : '') + '">' +
        sp.icon + ' ' + sp.key + '<br><span style="font-size:11px;font-weight:400">' + done + '/' + list.length + ' 確定</span></button>';
    });
    h += '</div>';
    if (S.sport === 'バスケ') {
      h += '<div class="card"><h2>🏀 前半・クイズバスケの集計</h2><p class="sub">4チームをまとめて記録し、2試合の合計を自動計算します。</p><div class="seg c3">';
      [1, 2, 3].forEach(function (r) { h += '<button data-act="basketOpen" data-round="' + r + '">ラウンド' + r + '</button>'; });
      h += '</div></div>';
      if (S.basket) {
        $('tab-matches').innerHTML = h + basketHtml();
        return;
      }
      h += '<div class="note">合計が分かっている試合は、下から直接確定できます。</div>';
    }
    if (S.sport === 'バド' || S.sport === 'バレー') h += '<div class="note">準決勝が2試合とも確定すると、決勝・3位決定戦の対戦が自動で入ります。引き分けでは確定できません。</div>';
    if (S.sport === 'ドッジ') h += '<div class="note">G-3・G-4 の対戦は、バドの準決勝が2試合とも確定すると自動で入ります。</div>';
    ms.filter(function (m) { return m.sport === S.sport; }).forEach(function (m) { h += matchCard(m); });
    $('tab-matches').innerHTML = h;
  }
  function firstOpenSport(ms) {
    for (var i = 0; i < SPORTS.length; i++) {
      var k = SPORTS[i].key;
      if (ms.some(function (m) { return m.sport === k && m.status !== '確定'; })) return k;
    }
    return 'バスケ';
  }
  ACTIONS.sport = function (el) { S.sport = el.getAttribute('data-v'); renderMatches(); loadPredSummaries(); };

  // ---- バスケ:前半と各問題の正解順 ----
  function basketScore() { return basketballRoundScores(S.basket.data.input, S.basket.data.courts); }
  function basketSummaryHtml() {
    var sc;
    try { sc = basketScore(); } catch (e) { return '<p class="err">' + esc(e.message) + '</p>'; }
    var h = '<div class="basket-totals">';
    TEAMS.forEach(function (t) {
      h += '<div class="soft' + t + '">' + teamChip(t) + '<b>' + sc.totals[t] + '点</b><small>前半 ' +
        (sc.input.firstHalf[t] === null ? '未入力' : sc.input.firstHalf[t]) + ' + クイズ ' + sc.quizPoints[t] + '</small></div>';
    });
    return h + '</div>';
  }
  function basketHtml() {
    var b = S.basket;
    if (b.loading) return '<div class="card">内訳を読み込み中…</div>';
    if (b.err) return '<div class="card"><p class="err">' + esc(b.err) + '</p><button class="btn" data-act="basketReload">保存済みを読み直す</button></div>';
    var d = b.data;
    var h = '<div class="card basket-editor"><h2>ラウンド' + d.round + ' の記録</h2>' +
      '<p class="sub">' + d.courts.map(function (c, i) { return 'コート' + (i + 1) + ': ' + c.join(' 対 '); }).join(' / ') + '</p>' +
      '<p class="basket-status">' + (b.dirty ? '内訳に未保存の変更があります' : '保存済みの内訳(初回は空欄)') + '</p>' +
      '<fieldset' + (b.saving ? ' disabled' : '') + '><h3>前半の得点</h3><div class="basket-halves">';
    TEAMS.forEach(function (t) {
      h += '<label>' + teamChip(t) + '<input class="t num" type="number" min="0" step="1" inputmode="numeric" aria-label="' + t + 'チームの前半得点" data-in="basketHalf" data-team="' + t + '" value="' + esc(d.input.firstHalf[t]) + '" placeholder="未入力"></label>';
    });
    h += '</div><h3>後半のクイズ</h3><p class="sub">正解したチームを、コートごとに順にタップ。不正解は押さず、正解なしは空のまま。選び直すときは同じチームをもう一度押します。</p>';
    d.input.questions.forEach(function (q, i) {
      h += '<div class="basket-question"><div class="row"><b>第' + (i + 1) + '問</b><select class="t grow" aria-label="第' + (i + 1) + '問の難しさ" data-chg="basketDifficulty" data-i="' + i + '">';
      ['かんたん', 'ふつう', 'むずかしい'].forEach(function (v) { h += '<option' + (q.difficulty === v ? ' selected' : '') + '>' + v + '</option>'; });
      h += '</select></div>';
      d.courts.forEach(function (court, c) {
        h += '<p class="sub">コート' + (c + 1) + '</p><div class="row">';
        court.forEach(function (t) {
          var rank = q.orders[c].indexOf(t);
          var pts = { 'かんたん': [2, 1], 'ふつう': [3, 2], 'むずかしい': [5, 3] }[q.difficulty];
          h += '<button class="btn grow basket-pick soft' + t + (rank >= 0 ? ' on' : '') + '" data-act="basketCorrect" data-i="' + i + '" data-court="' + c + '" data-team="' + t + '">' +
            teamChip(t) + (rank < 0 ? ' 未正解' : (rank === 0 ? ' 先に正解 ' : ' あとから正解 ') + pts[rank] + '点') + '</button>';
        });
        h += '</div>';
      });
      h += '</div>';
    });
    h += '<p class="sub">問題を追加(難しさはあとから変更できます)</p><div class="row">';
    ['かんたん', 'ふつう', 'むずかしい'].forEach(function (v) { h += '<button class="btn grow basket-add" data-act="basketAdd" data-difficulty="' + v + '">+ ' + v + '</button>'; });
    h += '</div>' + (d.input.questions.length ? '<button class="link-btn" data-act="basketRemove">最後の問題を削除</button>' : '') +
      '<h3>前半 + 後半の合計</h3><div id="basketSummary">' + basketSummaryHtml() + '</div>' +
      '<p class="sub">途中保存では試合の点数は変わりません。確定時に2試合とも更新します。</p>' +
      '<button class="btn block ghost" data-act="basketSave">内訳を途中保存</button><button class="btn block big accent" data-act="basketConfirm">合計を2試合に反映して確定</button>' +
      '<button class="btn block ghost" data-act="basketReload">保存済みを読み直す</button><button class="btn block ghost" data-act="basketClose">試合の一覧へ戻る</button></fieldset></div>';
    return h;
  }
  function loadBasket(round) {
    S.basket = { round: round, loading: true }; renderMatches();
    var b = S.basket;
    api('adminGetBasketballRound', [round], {
      onOk: function (d) { if (S.basket !== b) return; b.loading = false; b.data = d; renderMatches(); },
      onErr: function (e) { if (S.basket !== b) return; b.loading = false; b.err = e.message || '内訳を読み込めませんでした'; renderMatches(); }
    });
  }
  function afterBasketDiscard(fn) {
    if (S.basket && S.basket.saving) return;
    if (S.basket && S.basket.dirty) confirmBox('未保存の内訳を破棄しますか？', '途中保存していない変更は失われます。', '破棄して進む', fn, true);
    else fn();
  }
  ACTIONS.basketOpen = function (el) { afterBasketDiscard(function () { loadBasket(Number(el.getAttribute('data-round'))); }); };
  ACTIONS.basketReload = function () { afterBasketDiscard(function () { loadBasket(S.basket.round); }); };
  // 一覧へ戻るときも未保存の変更を黙って捨てない。
  ACTIONS.basketClose = function () { afterBasketDiscard(function () { S.basket = null; renderMatches(); }); };
  function changedBasket(redraw) {
    S.basket.dirty = true;
    if (redraw) renderMatches();
    else {
      $('basketSummary').innerHTML = basketSummaryHtml();
      var status = document.querySelector('.basket-status');
      if (status) status.textContent = '内訳に未保存の変更があります';
    }
  }
  INPUTS.basketHalf = function (el) { S.basket.data.input.firstHalf[el.getAttribute('data-team')] = el.value; changedBasket(false); };
  CHANGES.basketDifficulty = function (el) { S.basket.data.input.questions[Number(el.getAttribute('data-i'))].difficulty = el.value; changedBasket(true); };
  ACTIONS.basketAdd = function (el) {
    if (S.basket.data.input.questions.length >= 30) { showStatus('err', '1ラウンド30問までです'); return; }
    S.basket.data.input.questions.push({ difficulty: el.getAttribute('data-difficulty'), orders: [[], []] }); changedBasket(true);
  };
  ACTIONS.basketRemove = function () { confirmBox('最後の問題を削除しますか？', '最後の問題の正解順も削除します。', '削除する', function () { S.basket.data.input.questions.pop(); changedBasket(true); }, true); };
  ACTIONS.basketCorrect = function (el) {
    var order = S.basket.data.input.questions[Number(el.getAttribute('data-i'))].orders[Number(el.getAttribute('data-court'))];
    var t = el.getAttribute('data-team'), i = order.indexOf(t);
    if (i < 0) order.push(t); else order.splice(i, 1);
    changedBasket(true);
  };
  function saveBasket(confirm) {
    var b = S.basket;
    if (!b || !b.data || b.saving) return;
    var sc;
    try { sc = basketScore(); } catch (e) { showStatus('err', e.message); return; }
    if (confirm && !sc.ready) { showStatus('err', '前半の点数を4チームとも入れてください(0点も入力してください)'); return; }
    var send = function () {
      b.saving = true; renderMatches();
      api('adminSaveBasketballRound', [b.round, sc.input, b.data.revision, confirm], {
        save: true, noRetry: true,
        check: function () { ACTIONS.basketReload(); },
        onOk: function (d) {
          b.saving = false; b.dirty = false; b.data = d;
          if (confirm) {
            d.matches.forEach(function (m) { replaceMatch(m); delete S.drafts[m.id]; }); S.scores = null;
          }
          showStatus('ok', confirm ? '2試合の合計を確定しました' : '内訳を途中保存しました');
          if (S.sport === 'バスケ') renderMatches();
        },
        onErr: function (e) { b.saving = false; if (S.sport === 'バスケ') renderMatches(); if (e.code === 'CONFLICT') showStatus('err', e.message); }
      });
    };
    if (!confirm) { send(); return; }
    var lines = b.data.courts.map(function (c) { return c[0] + ' ' + sc.totals[c[0]] + ' - ' + sc.totals[c[1]] + ' ' + c[1]; });
    confirmBox('ラウンド' + b.round + ' の2試合を確定しますか？', 'クイズ ' + sc.input.questions.length + '問の記録から計算しました。\n' + lines.join('\n') + '\n\n確定済みの点数も、この合計に置き換わります。', '2試合を確定', send, false);
  }
  ACTIONS.basketSave = function () { saveBasket(false); };
  ACTIONS.basketConfirm = function () { saveBasket(true); };

  function draftOf(m) {
    var d = S.drafts[m.id];
    return d || { s1: m.score1 === null || m.score1 === undefined ? '' : String(m.score1), s2: m.score2 === null || m.score2 === undefined ? '' : String(m.score2) };
  }
  function isDirty(m) {
    var d = S.drafts[m.id];
    if (!d) return false;
    return String(d.s1) !== String(m.score1 === null ? '' : m.score1) || String(d.s2) !== String(m.score2 === null ? '' : m.score2);
  }
  function matchCard(m) {
    var confirmed = m.status === '確定';
    var dirty = isDirty(m);
    var h = '<div class="card match" id="match-' + esc(m.id) + '">';
    h += '<div class="head"><span class="round">' + esc(m.round) + '</span><span class="sub">' + esc(m.id) + '</span>';
    if (m.related) { var rm = matchById(m.related); h += '<span class="sub">(' + esc(rm ? matchLabel(rm) : m.related) + 'と同時)</span>'; }
    h += '<span style="margin-left:auto"></span>';
    if (m.sport === 'バレー' && m.predictionStatus !== 'なし') h += '<span class="badge pred">予想:' + esc(m.predictionStatus) + '</span> ';
    h += dirty ? '<span class="badge dirty">未保存</span>' : (confirmed ? '<span class="badge done">確定 ✓</span>' : '<span class="badge">予定</span>');
    h += '</div>';

    if (!m.team1 || !m.team2) {
      h += '<div class="note">対戦チームはまだ決まっていません(準決勝の確定で自動で入ります)。</div>';
      h += teamFixer(m);
      h += '</div>';
      return h;
    }
    var d = draftOf(m);
    h += '<div class="scorebox">';
    h += scoreSide(m, 1, m.team1, d.s1);
    h += '<div class="vs">-</div>';
    h += scoreSide(m, 2, m.team2, d.s2);
    h += '</div>';
    h += '<div class="actions">';
    if (!confirmed) h += '<button class="btn block big accent" data-act="saveMatch" data-id="' + esc(m.id) + '">確定</button>';
    else if (dirty) h += '<button class="btn block big accent" data-act="saveMatch" data-id="' + esc(m.id) + '">修正して確定</button>';
    else h += '<button class="btn block big ghost" disabled>確定済み ' + esc(m.team1) + ' ' + esc(m.score1) + ' - ' + esc(m.score2) + ' ' + esc(m.team2) + '</button>';
    h += '<div class="row" style="justify-content:space-between">';

  INPUTS.score = function (el) {

  /* 点数欄の Enter は、次の欄へ進む・入力を終えるだけ。確定は大きなボタンで押す(押しまちがいで確定しないように) */
  document.querySelector('main').addEventListener('keydown', function (e) {

  /**
   * 準決勝(バド D-SF・バレー V-SF)の修正・取消で、あとの試合から消えるもの。
   * 勝ったチームが変わる(または確定を取り消す)と、決勝・3位決定戦・ドッジ(G-3・G-4)の組み合わせが入れ直され、
   * その試合の点数・確定・予想が消える(サーバーの動きは前からこのとおり)。消えるものが無ければ空の配列
   * @param newWinner 修正後に勝つチーム(確定の取消なら null)
   */
  function semifinalImpact(m, newWinner) {
    var mt = /^([DV])-SF[12]$/.exec(m.id);
    if (!mt || m.status !== '確定') return [];
    var oldWinner = m.score1 > m.score2 ? m.team1 : m.team2;
    if (newWinner && newWinner === oldWinner) return [];
    var ids = mt[1] === 'D' ? ['D-F', 'D-3RD', 'G-3', 'G-4'] : ['V-F', 'V-3RD'];
    var lost = [];
    ids.forEach(function (id) {
      var x = matchById(id);
      if (!x || !x.team1 || !x.team2) return;
      var what = [];
      if (x.status === '確定') what.push('確定した点数 ' + x.team1 + ' ' + x.score1 + '-' + x.score2 + ' ' + x.team2);
      else if (x.score1 !== null && x.score1 !== undefined && x.score1 !== '') what.push('入力した点数');
      if (x.predictionStatus === '受付中' || x.predictionStatus === '公開') what.push('集まった予想(受付前に戻ります)');
      if (what.length) lost.push('・' + matchLabel(x) + ':' + what.join('、'));
    });
    return lost;
  }
  ACTIONS.resetDraft = function (el) { delete S.drafts[el.getAttribute('data-id')]; renderMatches(); };
  ACTIONS.saveMatch = function (el) {
    var id = el.getAttribute('data-id');
    var m = matchById(id);
    var d = draftOf(m);
    var s1 = String(d.s1).trim(), s2 = String(d.s2).trim();
    if (s1 === '' || s2 === '') { showStatus('err', '2チームとも点数を入れてください'); return; }
    var n1 = Number(s1), n2 = Number(s2);
    if (isNaN(n1) || isNaN(n2) || n1 < 0 || n2 < 0) { showStatus('err', '点数は0以上の数で入れてください'); return; }
    if ((m.sport === 'バド' || m.sport === 'バレー') && n1 === n2) { showStatus('err', 'トーナメントの試合は引き分けにできません'); return; }
    var wasConfirmed = m.status === '確定';
    var send = function () {
      api('adminSaveMatch', [id, n1, n2], {
        save: true, btn: el,
        onOk: function (r) {
          delete S.drafts[id];
          replaceMatch(r.match);
          (r.changes || []).forEach(function (c) {
            var x = matchById(c.id);
            if (x) { x.team1 = c.team1; x.team2 = c.team2; }
          });
          S.scores = null;
          var msg = (wasConfirmed ? '修正しました ' : '確定しました ') + r.match.team1 + ' ' + r.match.score1 + '-' + r.match.score2 + ' ' + r.match.team2;
          if (r.predictionClosed) { msg += '/予想も締め切りました'; delete S.pred[id]; }
          if (r.changes && r.changes.length) {
            msg += '/自動で入れた対戦:' + r.changes.map(function (c) { var x = matchById(c.id); return (x ? x.sport + x.round : c.id) + ' ' + c.team1 + '-' + c.team2; }).join('、');
          }
          showStatus('ok', msg);
          render();
          /* 組み合わせが変わると、関連する試合の点数・確定・予想も変わるので、試合をまとめて取り直す */
          if (r.changes && r.changes.length) { S.pred = {}; loadOverview(function () { loadPredSummaries(); safeRender(); }); }
          else loadPredSummaries();
        }
      });
    };
    /* 準決勝の修正で勝ったチームが変わるときは、あとの試合から消えるものを出して確かめる */
    var lost = semifinalImpact(m, n1 > n2 ? m.team1 : m.team2);
    if (lost.length) {
      confirmBox('修正すると、あとの試合の記録が消えます', matchLabel(m) + ' の勝ったチームが変わるので、決勝・3位決定戦などの組み合わせを入れ直します。次のものが消えます。\n\n' +
        lost.join('\n') + '\n\n消えた試合は、もう一度点数を入れてください。', '修正して確定', send, true);
      return;
    }
    send();
  };
  function replaceMatch(nm) {

  function odaiRow(no, t) {

  function odaiDraft(no) {
    if (S.odaiDraft[no]) return S.odaiDraft[no];

    var defs = (S.odai && S.odai.defaultAnswered) || {};
    TEAMS.forEach(function (t) {
      var r = odaiRow(no, t);
      if (r && r.theme && !theme) theme = r.theme;
      teams[t] = r ? { matched: String(r.matched), answered: String(r.answered) } : { matched: '', answered: String(defs[t] === undefined ? '' : defs[t]) };
    });

    return S.odaiDraft[no];
  }

    var m = Number(matched), a = Number(answered);

    return m === a ? setting('お題カード:全員一致の点', 2) : setting('お題カード:それ以外の係数', 1.5) * m / a;

  ACTIONS.odaiSave = function (el) {
    var no = S.odaiNo;
    var d = odaiDraft(no);
    var jobs = [];
    for (var i = 0; i < TEAMS.length; i++) {
      var t = TEAMS[i], v = d.teams[t];
      if (String(v.matched).trim() === '') continue;
      var m = Number(v.matched), a = Number(v.answered);
      if (isNaN(m) || isNaN(a) || m < 0 || a < 0 || String(v.answered).trim() === '') { showStatus('err', 'チーム' + t + 'の人数を数字で入れてください'); return; }
      if (m > a) { showStatus('err', 'チーム' + t + ':そろった人数が答えた人数より多いです'); return; }
      jobs.push({ number: no, theme: d.theme.trim(), team: t, matched: m, answered: a });
    }
    if (!jobs.length) { showStatus('err', 'そろった人数を入れてください'); return; }
    el.disabled = true;
    var k = 0;
    var next = function () {
      if (k >= jobs.length) {
        el.disabled = false;
        showStatus('ok', 'お題' + no + 'を保存しました(' + jobs.length + 'チーム)');
        delete S.odaiDraft[no];
        S.scores = null;
        api('adminGetOdai', [], { onOk: function (o) { S.odai = o; if (S.tab === 'quiz') safeRender(); } });
        return;
      }
      var job = jobs[k];
      api('adminSaveOdai', [job], {
        save: '保存中…(' + (k + 1) + '/' + jobs.length + ')',
        onOk: function () {
          // 保存できた分を手元にも入れる
          var rows = S.odai.rows, found = false;
          rows.forEach(function (r) { if (r.number === job.number && r.team === job.team) { r.matched = job.matched; r.answered = job.answered; r.theme = job.theme; found = true; } });
          if (!found) rows.push({ number: job.number, theme: job.theme, team: job.team, matched: job.matched, answered: job.answered });
          k++;
          next();
        },
        onErr: function () { el.disabled = false; }
      });
    };
    next();
  };

    h += '<input class="t" type="search" data-in="rosterQ" placeholder="名前・ひらがなで探す" value="' + esc(S.rosterQuery) + '">';
    h += '<div class="chips" style="margin:8px 0">';
    [['all', '全員'], ['A', 'A'], ['B', 'B'], ['C', 'C'], ['D', 'D'], ['notArrived', '未来場'], ['noIntro', '自己紹介まだ']].forEach(function (f) {
      h += '<button class="chip' + (S.rosterFilter === f[0] ? ' on' : '') + '" data-act="rosterFilter" data-v="' + f[0] + '">' + (TEAM_MARK[f[0]] ? TEAM_MARK[f[0]] + ' ' : '') + f[1] + '</button>';
    });
    h += '</div><div id="rosterList">' + rosterListHtml() + '</div></div>';
    $('tab-roster').innerHTML = h;
  }
  function rosterListHtml() {
    var ps = S.ov.participants || [];
    var q = S.rosterQuery.replace(/[\s　]/g, '');
    var list = ps.filter(function (p) {
      if (S.rosterFilter === 'notArrived' && p.arrivedAt) return false;
      if (S.rosterFilter === 'noIntro' && p.introDone) return false;
      if (TEAMS.indexOf(S.rosterFilter) >= 0 && p.team !== S.rosterFilter) return false;
      if (q && (p.name + p.kana + p.id).replace(/[\s　]/g, '').indexOf(q) < 0) return false;
      return true;
    });
    if (!list.length) return '<p class="sub">いません</p>';
    var quizStarted = !!S.ov.state.quizStartedAt;
    return list.map(function (p) {
      var h = '<div class="person" data-act="openPerson" data-id="' + esc(p.id) + '">' + teamChip(p.team) +
        '<div class="grow"><div class="nm">' + esc(p.name || p.id) + '</div><div class="kn">' + esc(p.kana) + '・' + esc(p.id) + '</div></div><div class="flags">' +
        '<span class="flag ' + (p.arrivedAt ? 'on' : '') + '">' + (p.arrivedAt ? '来場 ' + clock(p.arrivedAt) : '未来場') + '</span>' +
        '<span class="flag ' + (p.introDone ? 'on' : '') + '">' + (p.introDone ? '自己紹介✓' : '自己紹介まだ') + '</span>' +
        (p.quizAnswered ? '<span class="flag on">クイズ✓</span>' : '') +
        (!p.quizInclude ? '<span class="flag off">クイズ除外</span>' : '') +
        (p.walkIn ? '<span class="flag">当日</span>' : '') + '</div></div>';
      if (S.openPerson === p.id) {
        h += '<div class="person-edit">';
        h += '<label class="f" style="margin-top:0">チームを変える</label><div class="seg c4">';
        TEAMS.forEach(function (t) {
          h += '<button class="team-btn bg' + t + (p.team === t ? ' on' : '') + '" data-act="changeTeam" data-id="' + esc(p.id) + '" data-v="' + t + '">' + TEAM_MARK[t] + ' ' + t + '</button>';
        });
        h += '</div>';
        if (quizStarted) h += '<p class="sub" style="margin:4px 0 0">クイズ開始のあとにチームを変えたら、クイズタブの「問題を作り直して開始」を使ってください。</p>';
        h += '<div class="row" style="margin-top:10px">';
        h += p.arrivedAt
          ? '<button class="btn ghost grow" data-act="arrive" data-id="' + esc(p.id) + '" data-v="0">来場を取り消す</button>'
          : '<button class="btn accent grow" data-act="arrive" data-id="' + esc(p.id) + '" data-v="1">来場にする</button>';
        h += '</div>';
        h += '<label class="switch" style="margin-top:10px"><input type="checkbox" data-chg="quizInclude" data-id="' + esc(p.id) + '"' + (p.quizInclude ? ' checked' : '') + '> クイズの計算に含める</label>';
        h += '<p class="sub" style="margin:4px 0 0">途中参加などでチームの平均から外すときはオフに。</p>';
        h += '</div>';
      }
      return h;
    }).join('');
  }
  function refreshRosterList() { var el = $('rosterList'); if (el) el.innerHTML = rosterListHtml(); }
  INPUTS.rosterQ = function (el) { S.rosterQuery = el.value; refreshRosterList(); };
  ACTIONS.rosterFilter = function (el) { S.rosterFilter = el.getAttribute('data-v'); renderRoster(); };
  ACTIONS.openPerson = function (el) {
    var id = el.getAttribute('data-id');
    S.openPerson = S.openPerson === id ? null : id;
    refreshRosterList();
  };
  function updatePerson(id, fn) {
    var p = personById(id);
    if (p) fn(p);
  }
  ACTIONS.changeTeam = function (el) {
    var id = el.getAttribute('data-id'), t = el.getAttribute('data-v');
    var p = personById(id);
    if (!p || p.team === t) return;
    api('adminChangeTeam', [id, t], {
      save: true, ok: (p.name || id) + ' を チーム' + t + ' にしました', btn: el,
      onOk: function () { updatePerson(id, function (x) { x.team = t; }); S.scores = null; renderRoster(); }
    });
  };
  ACTIONS.arrive = function (el) {
    var id = el.getAttribute('data-id'), on = el.getAttribute('data-v') === '1';
    api('adminSetArrived', [id, on], {
      save: true, ok: on ? '来場にしました' : '来場を取り消しました', btn: el,
      onOk: function () { updatePerson(id, function (x) { x.arrivedAt = on ? now() : null; }); renderRoster(); }
    });
  };
  CHANGES.quizInclude = function (el) {
    var id = el.getAttribute('data-id'), on = el.checked;
    el.disabled = true;
    api('adminSetQuizInclude', [id, on], {
      save: true, ok: on ? 'クイズの計算に含めます' : 'クイズの計算から外しました',
      onOk: function () { updatePerson(id, function (x) { x.quizInclude = on; }); S.scores = null; renderRoster(); },
      onErr: function () { el.disabled = false; el.checked = !on; }
    });
  };
  function doImport(overwrite, btn) {
    api('adminImportRoster', overwrite ? [{ overwriteTeams: true }] : [], {
      save: '読み込み中…', btn: btn,
      onOk: function (r) {
        S.lastImport = r;
        showStatus('ok', '読み込みました(新しく ' + r.added + '人)');
        loadOverview(function () { if (S.tab === 'roster') renderRoster(); });
      }
    });
  }
  ACTIONS.import = function (el) { doImport(false, el); };
  ACTIONS.importOverwrite = function () {
    confirmBox('名簿のチームで上書きしますか？', '当日にアプリで変えたチームも、名簿ファイルのチームに戻ります。', '上書きして読み込む', function () { doImport(true, null); }, true);
  };
  ACTIONS.walkTeam = function (el) {
    S.walkTeam = el.getAttribute('data-v');
    var bs = document.querySelectorAll('[data-act="walkTeam"]');
    for (var i = 0; i < bs.length; i++) bs[i].className = 'team-btn bg' + bs[i].getAttribute('data-v') + (bs[i].getAttribute('data-v') === S.walkTeam ? ' on' : '');
  };
  ACTIONS.walkAdd = function (el) {
    var name = $('wName').value.trim(), kana = $('wKana').value.trim(), origin = $('wOrigin').value.trim();
    if (!name || !kana) { showStatus('err', '名前とひらがなを入れてください'); return; }
    if (!/[\s　]/.test(name) || !/[\s　]/.test(kana)) { showStatus('err', '名字と名前の間にスペースを入れてください'); return; }
    if (!S.walkTeam) { showStatus('err', 'チームを選んでください'); return; }
    api('adminAddWalkIn', [{ name: name, kana: kana, team: S.walkTeam, origin: origin }], {
      save: '追加中…', btn: el,
      onOk: function (r) {
        showStatus('ok', name + ' さんを チーム' + r.team + ' に追加しました(' + r.id + ')');
        S.walkTeam = '';
        loadOverview(function () { if (S.tab === 'roster') renderRoster(); });
      }
    });
  };

  // ============ はじめ ============
  S.token = ssGet(TOKEN_KEY);
  if (S.token) toApp();
  else toLogin('');
})();
</script>
