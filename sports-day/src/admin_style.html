<style>
  /* 運営画面の見た目。スマホ縦向き前提。クリーム色の紙+白い角丸カード+チームカラー */
  :root {
    --bg: #f5efe0;
    --card: #ffffff;
    --ink: #2f2a24;
    --sub: #7a7064;
    --line: #e6dccb;
    --accent: #c76b3a;
    --ok: #3f8a55;
    --ng: #b8463f;
    --warn: #c9962a;
    --A: #c24a43;
    --B: #3f6fae;
    --C: #d4a52a;
    --D: #3f8250;
    --A-soft: #f7e3e1;
    --B-soft: #e0e9f5;
    --C-soft: #f7efd6;
    --D-soft: #e1efe3;
    --radius: 16px;
    --tabh: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(rgba(140, 110, 70, .06) 1px, transparent 1px),
      radial-gradient(rgba(140, 110, 70, .04) 1px, transparent 1px);
    background-size: 7px 7px, 13px 13px;
    background-position: 0 0, 3px 5px;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ---- 上の帯 ---- */
  .top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px calc(10px) 14px;
    background: rgba(245, 239, 224, .95);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(4px);
  }
  .top h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode-pill {
    font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--ink); color: #fff; white-space: nowrap;
  }
  .icon-btn {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    min-width: 48px; height: 48px; padding: 0 10px; font-size: 18px; cursor: pointer;
  }

  /* ---- 保存中などの表示 ---- */
  .status {
    position: fixed; left: 12px; right: 12px; top: 64px; z-index: 50;
    padding: 12px 14px; border-radius: 14px; font-weight: 700; font-size: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,.15);
    display: flex; align-items: center; gap: 10px;
  }
  .status.saving { background: #4b4339; color: #fff; }
  .status.ok { background: var(--ok); color: #fff; }
  .status.err { background: var(--ng); color: #fff; }
  .status .msg { flex: 1; }
  .status button { border: 0; border-radius: 999px; min-height: 44px; padding: 8px 12px; background: #fff; color: var(--ng); font-weight: 700; }

  /* ---- 中身 ---- */
  main { padding: 12px 12px calc(var(--tabh) + 28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 14px;
    margin-bottom: 12px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 2px 10px rgba(80,60,30,.06);
  }
  .card h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  .card h2 .right { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--sub); }
  .sub { color: var(--sub); font-size: 13px; }
  .note { font-size: 13px; color: var(--sub); background: #faf6ec; border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
  .note.warn { color: #7a5a10; background: #fbf1d4; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .big-num { font-size: 40px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .center { text-align: center; }
  details > summary { cursor: pointer; color: var(--sub); font-size: 14px; padding: 4px 0; }

  /* ---- ボタン ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px; padding: 10px 18px; border-radius: 999px; border: 0;
    background: var(--ink); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.block { display: flex; width: 100%; }
  .btn.big { min-height: 58px; font-size: 18px; }
  .btn.accent { background: var(--accent); }
  .btn.ok { background: var(--ok); }
  .btn.ng { background: var(--ng); }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  /* よく使う小さいボタンも、指で押しやすい高さ(48pxくらい)にする(P2-4) */
  .btn.small { min-height: 48px; padding: 6px 14px; font-size: 14px; }
  .link-btn { border: 0; background: none; color: var(--sub); text-decoration: underline; font-size: 14px; min-height: 48px; padding: 12px 8px; cursor: pointer; }

  /* 選択式(モード・種目・チーム) */
  .seg { display: grid; gap: 8px; }
  .seg.c2 { grid-template-columns: repeat(2, 1fr); }
  .seg.c3 { grid-template-columns: repeat(3, 1fr); }
  .seg.c4 { grid-template-columns: repeat(4, 1fr); }
  .seg.c5 { grid-template-columns: repeat(5, 1fr); }
  .seg button {
    min-height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff;
    font-weight: 700; font-size: 15px; padding: 6px 4px; cursor: pointer;
  }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
    min-height: 46px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---- チーム ---- */
  .team { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 15px; flex: none; }
  .team.lg { width: 44px; height: 44px; font-size: 22px; }
  .team.A, .bgA { background: var(--A); }
  .team.B, .bgB { background: var(--B); }
  .team.C, .bgC { background: var(--C); }
  .team.D, .bgD { background: var(--D); }
  .team.none { background: #bbb; }
  /* 黄色は白文字が読みにくいので、濃い文字にする(P2-4)。赤・緑は白文字で読めるように、少しだけ濃くしている */
  .team.C { color: #3a2c05; }
  .team-btn.bgC { color: #3a2c05 !important; }
  .softA { background: var(--A-soft); } .softB { background: var(--B-soft); }
  .softC { background: var(--C-soft); } .softD { background: var(--D-soft); }
  .team-btn { color: #fff !important; border: 0 !important; opacity: .35; }
  .team-btn.on { opacity: 1; outline: 3px solid var(--ink); outline-offset: 2px; }

  /* ---- 入力 ---- */
  label.f { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  input.t, select.t {
    width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line);
    padding: 8px 12px; background: #fff; font-size: 16px;
  }
  input.t:focus, select.t:focus, input.score:focus, input.num:focus { outline: 3px solid rgba(199,107,58,.35); border-color: var(--accent); }
  input.num {
    width: 72px; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line);
    text-align: center; font-size: 22px; font-weight: 700; background: #fff;
  }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px; }
  .switch input { width: 22px; height: 22px; }

  /* ---- 試合 ---- */
  .match { padding: 12px; }
  .match .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .match .head .round { font-weight: 800; font-size: 16px; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #eee; color: #555; white-space: nowrap; }
  .badge.done { background: #dcefe1; color: #2e6b40; }
  .badge.dirty { background: #fbe9d7; color: #9a4f1d; }
  .badge.pred { background: #e6e0f4; color: #4c3d84; }
  .scorebox { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .side { border-radius: 14px; padding: 8px; text-align: center; }
  .side .tname { font-weight: 800; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  input.score {
    width: 100%; height: 72px; border-radius: 12px; border: 2px solid rgba(0,0,0,.1); background: #fff;
    font-size: 44px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; padding: 0;
  }
  .vs { font-weight: 800; color: var(--sub); }
  .match .actions { margin-top: 10px; }
  .pred-box { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .pred-team { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 15px; }

  /* ---- 順位 ---- */
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; margin-bottom: 8px; }
  .rank-row .rk { font-size: 34px; font-weight: 900; width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  .rank-row .rk small { font-size: 16px; }
  .rank-row .pts { margin-left: auto; font-size: 38px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .rank-row .pts small { font-size: 15px; font-weight: 700; margin-left: 2px; }
  .rank-row .detail { font-size: 12px; color: #4b4339; }
  table.bd { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.bd th, table.bd td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  table.bd th:first-child, table.bd td:first-child { text-align: left; }
  table.bd thead th { font-size: 12px; color: var(--sub); font-weight: 700; }
  table.bd tr.sum td { font-weight: 800; }

  /* ---- 名簿 ---- */
  .person { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .person:last-child { border-bottom: 0; }
  .person .nm { font-weight: 700; }
  .person .kn { font-size: 12px; color: var(--sub); }
  .flags { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .flag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #eee; color: #666; white-space: nowrap; }
  .flag.on { background: #dcefe1; color: #2e6b40; }
  .flag.off { background: #f6dede; color: #8a3232; }
  .person-edit { background: #faf6ec; border-radius: 12px; padding: 10px; margin: 0 0 8px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stat-grid .n { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-grid .l { font-size: 12px; color: var(--sub); }

  /* ---- クイズ ---- */
  .nm-item { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 8px; }
  .nm-item .input { font-size: 22px; font-weight: 800; }
  .nm-item .noinput { font-size: 14px; color: var(--sub); }
  .nm-item .writer { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .btn.judge { min-height: 52px; padding: 8px 6px; }

  /* ---- 下のタブ ---- */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: #fff; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button {
    height: var(--tabh); border: 0; background: none; font-size: 12px; font-weight: 700; color: var(--sub);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; cursor: pointer;
  }
  nav.tabs button .ic { font-size: 22px; line-height: 1; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs button.on::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
  .dot { position: absolute; top: 8px; right: 22%; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--ng); color: #fff; font-size: 11px; line-height: 18px; }

  /* ---- ログイン ---- */
  .login { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
  .login h1 { font-size: 22px; text-align: center; margin: 0 0 4px; }

  /* ---- 確認 ---- */
  .modal-bg { position: fixed; inset: 0; background: rgba(30,25,20,.45); z-index: 60; display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 20px; padding: 18px; width: 100%; max-width: 480px; margin-bottom: env(safe-area-inset-bottom); }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal .body { font-size: 15px; margin-bottom: 14px; white-space: pre-line; }

/* 読み上げ用の原稿 */
.script p { margin: 12px 0; font-size: 17px; line-height: 1.6; }
.script p b.pt { font-size: 24px; margin-left: 8px; }
/* 予想の受付を始めてからの経過時間 */
.elapsed{font-size:12px;color:var(--sub,#777);text-align:center;line-height:1.3;min-width:72px}
.elapsed b{font-size:22px;color:var(--ink,#333);font-variant-numeric:tabular-nums}
/* 前半・クイズバスケの記録 */
.basket-editor fieldset{border:0;margin:0;padding:0;min-width:0}
.basket-halves,.basket-totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.basket-halves label{display:flex;align-items:center;gap:8px;min-width:0}
.basket-halves input{width:100%;min-width:0}
.basket-totals>div{border-radius:12px;padding:10px}
.basket-totals b{font-size:26px;margin-left:8px}
.basket-totals small{display:block;margin-top:4px}
.basket-question{border:1px solid var(--line);border-radius:14px;padding:10px;margin:12px 0}
.basket-pick{min-width:0;padding:10px 4px;font-size:14px;border:2px solid transparent;color:var(--ink)}
.basket-pick.on{border-color:var(--ink);font-weight:800}
.basket-add{font-size:13px;padding:10px 4px;min-height:48px}
.basket-status{font-size:13px;color:var(--sub)}
</style>
