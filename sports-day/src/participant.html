<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- 仮の参加者画面(本番の画面は別に作る)。サーバーとのやりとりの確認用 -->
  <style>
    body { font-family: sans-serif; margin: 16px; }
    button { display: block; margin: 6px 0; padding: 10px; font-size: 16px; width: 100%; }
    pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  </style>
</head>
<body>
  <h1>合同運動会(仮の画面)</h1>
  <p>チーム: <span id="team"></span></p>
  <div id="members"></div>
  <pre id="out">読み込み中…</pre>
  <script>
    var TEAM = '<?!= team ?>'; // サーバーから渡されたチーム(A〜D、なければ空)
    document.getElementById('team').textContent = TEAM || '(未選択)';
    function show(res) { document.getElementById('out').textContent = JSON.stringify(res, null, 2); }
    function call(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      var runner = google.script.run.withSuccessHandler(show).withFailureHandler(function (e) { show({ ok: false, error: { code: 'NETWORK', message: String(e) } }); });
      runner[name].apply(runner, args);
    }
    google.script.run.withSuccessHandler(show).getState();
    if (TEAM) {
      google.script.run.withSuccessHandler(function (res) {
        if (!res.ok) return show(res);
        var box = document.getElementById('members');
        res.data.members.forEach(function (m) {
          var b = document.createElement('button');
          b.textContent = m.name + '(' + m.kana + ')';
          b.onclick = function () { call('selectSelf', m.id); };
          box.appendChild(b);
        });
      }).listTeamMembers(TEAM);
    }
  </script>
</body>
</html>
