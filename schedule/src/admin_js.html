<script>
(function () {
  'use strict';
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return ('0' + n).slice(-2); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return esc(s);
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return (+m[2]) + '/' + (+m[3]) + '(' + WD[d.getDay()] + ')';
  }
  function lsGet(k, def) { try { var v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* */ } }
  var toastTimer;
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200); }
  function call(fn, args) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) return resolve(res.data);
          var err = (res && res.error) || { code: 'INTERNAL', message: 'エラーが起きました' };
          if (err.code === 'AUTH' && fn !== 'adminLogin') { lsSet('sch.admin', ''); S.token = ''; S.view = 'login'; render(); }
          reject(err);
        })
        .withFailureHandler(function () { reject({ code: 'NETWORK', message: '通信できませんでした' }); })[fn].apply(null, [S.token].concat(args || []));
    });
  }
  function fail(err) { S.busy = false; toast((err && err.message) || 'エラーが起きました'); render(); }
  function qrImg(text) {
    if (!window.qrcode) return '';
    var q = qrcode(0, 'M'); q.addData(text); q.make();
    return q.createDataURL(6, 2);
  }
  function copy(text) {
    var ok = function () { toast('コピーしました'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
    else { fallbackCopy(text); ok(); }
  }
  function fallbackCopy(text) { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) { /* */ } t.remove(); }

  var S = { token: lsGet('sch.admin', ''), view: 'loading', groups: [], group: null, res: null, filter: {}, busy: false, modal: null, form: null, err: '' };
  var app = document.getElementById('app');

  // ===== 読み込み =====
  function loadHome(keep) {
    if (!keep) { S.view = 'loading'; render(); }
    call('adminListGroups').then(function (d) { S.groups = d.groups; S.view = 'home'; render(); }).catch(fail);
  }
  function loadGroup(id, keep) {
    if (!keep) { S.view = 'loading'; render(); }
    call('adminGetGroup', [id]).then(function (d) { S.group = d; S.view = 'group'; render(); }).catch(fail);
  }
  /** いまの画面を読み直す(「最新にする」ボタンと、ほかのタブから戻ってきたとき) */
  function refresh(quiet) {
    if (S.view === 'event' && S.res) loadEvent(S.group.group.id, S.res.event.id, true);
    else if (S.view === 'group' && S.group) loadGroup(S.group.group.id, true);
    else if (S.view === 'home') loadHome(true);
    else return;
    if (!quiet) toast('最新にしました');
  }
  function loadEvent(gid, eid, keep) {
    if (!keep) { S.view = 'loading'; render(); }
    var gp = S.group && S.group.group.id === gid ? Promise.resolve(S.group) : call('adminGetGroup', [gid]).then(function (d) { S.group = d; return d; });
    gp.then(function () { return call('adminGetResults', [gid, eid, S.filter]); })
      .then(function (d) { S.res = d; S.view = 'event'; S.busy = false; render(); }).catch(fail);
  }

  // ===== 画面 =====
  function render() {
    var h = '';
    if (S.view === 'loading') h = '<div class="loading">読み込み中…</div>';
    else if (S.view === 'login') h = viewLogin();
    else if (S.view === 'home') h = viewHome();
    else if (S.view === 'newGroup') h = viewNewGroup();
    else if (S.view === 'group') h = viewGroup();
    else if (S.view === 'newEvent') h = viewNewEvent();
    else if (S.view === 'event') h = viewEvent();
    if (S.modal) h += '<div class="modal-bg" data-act="closeModal"><div class="modal" data-stop="1">' + viewModal() + '</div></div>';
    app.innerHTML = h;
  }

  function viewLogin() {
    return '<div class="login card"><h1>日程調整 運営</h1><p class="sub">運営のパスワードを入れてください</p>' +
      '<div class="field"><input type="password" data-in="pw" autocomplete="current-password"></div>' +
      (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
      '<button class="btn" data-act="login"' + (S.busy ? ' disabled' : '') + '>ログイン</button></div>';
  }

  function badge(st) {
    return st === '日程調整中' ? '<span class="badge poll">日程調整中</span>' : st === '時間調整中' ? '<span class="badge poll">時間調整中</span>' : st === '出欠確認中' ? '<span class="badge rsvp">出欠確認中</span>' : '<span class="badge">終了</span>';
  }

  // B案への引っ越し(11/28)。グループの一覧のいちばん下に出す
  function movePart() {
    var m = S.move;
    var h = '<div class="card" style="margin-top:24px"><div class="row"><b class="grow">新しいアプリ(B案)への引っ越し</b>' +
      (m ? '' : '<button class="btn ghost sm" data-act="moveOpen">開く</button>') + '</div>';
    if (!m) return h + '</div>';
    var label = m.mode === 'moving' ? '引っ越し中(答えを止めています)' : m.mode === 'moved' ? '引っ越しました(新しいリンクを出しています)' : 'ふつう(引っ越し前)';
    h += '<div class="sub" style="margin:6px 0">いま:<b>' + label + '</b></div>';
    h += '<div class="sub">1. 「引っ越し中にする」→ 2. 「書き出す」→ パソコンで B に入れる → 3. 新しいリンクを貼って「引っ越しました」</div>';
    h += '<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">' +
      '<button class="btn ghost sm" data-act="moveSet" data-v="moving">1. 引っ越し中にする</button>' +
      '<button class="btn ghost sm" data-act="moveExport">2. 書き出す</button>' +
      '<button class="btn ghost sm" data-act="moveSet" data-v="">ふつうに戻す</button></div>';
    if (S.moveExport) {
      h += '<div class="sub" style="margin-top:8px">ファイルが保存されないときは、下の中身を全部コピーして、メモ帳で <b>a-export.json</b> という名前で保存してください</div>' +
        '<textarea class="remind" readonly style="min-height:80px">' + esc(S.moveExport) + '</textarea>' +
        '<button class="btn ghost sm" data-act="moveCopy">中身を全部コピー</button>';
    }
    h += '<div class="field" style="margin-top:10px"><label class="sub">3. 新しいリンク(パソコンで B に入れたときに出る links の中身をそのまま貼る)</label>' +
      '<textarea class="remind" data-in="moveLinks" style="min-height:60px" placeholder=\'{"G001":"https://…/g/…"}\'>' + esc(S.moveLinks || '') + '</textarea></div>' +
      '<button class="btn sm" data-act="moveDone">3. 「引っ越しました」にする</button>';
    return h + '</div>';
  }

  function viewHome() {
    var h = '<div class="top"><div class="grow"><h1>日程調整 運営</h1><div class="sub">グループとイベントの一覧</div></div>' +
      '<button class="btn ghost" data-act="newOnce">1回きりのイベントを作る</button><button class="btn" data-act="newGroup">グループを作る</button></div>';
    if (!S.groups.length) return h + '<div class="card">まだグループがありません。「グループを作る」から始めましょう。</div>' + movePart();
    h += '<div class="grid">';
    S.groups.forEach(function (g) {
      var live = g.events.filter(function (e) { return !e.archived; });
      h += '<div class="card"><div class="row"><div class="grow"><b style="font-size:16px">' + esc(g.name) + '</b> <span class="badge">' + esc(g.kind) + '</span>' +
        '<div class="sub">メンバー ' + g.memberCount + '人 ・ イベント ' + live.length + '</div></div>' +
        '<button class="btn ghost sm" data-act="renameFromList" data-id="' + esc(g.id) + '" data-name="' + esc(g.name) + '">名前を変える</button>' +
        '<button class="btn ghost sm" data-act="openGroup" data-id="' + esc(g.id) + '">開く</button></div>';
      live.slice(0, 4).forEach(function (e) {
        h += '<button class="evline" data-act="openEvent" data-g="' + esc(g.id) + '" data-id="' + esc(e.id) + '"><span class="grow">' + esc(e.name) + '</span>' +
          '<span class="sub">' + e.answered + '人</span>' + badge(e.status) + '</button>';
      });
      h += '</div>';
    });
    return h + '</div>' + movePart();
  }

  function viewNewGroup() {
    var f = S.form;
    var kinds = [['サークル', '名簿(運動会の名簿)の人が最初からメンバー。未回答の人がわかる。学年・男女で絞れる'],
      ['グループ', '男子飲み会・研究室・友達など。リンクを開いた人が名前を入れて加わる'],
      ['1回きり', 'このイベントだけ。カラオケなど、グループを作るほどでもない予定']];
    var h = '<div class="top"><div class="grow"><div class="crumb"><button data-act="home">一覧</button> ›</div><h1>グループを作る</h1></div></div><div class="card" style="max-width:720px">';
    h += '<div class="field"><label>名前</label><input data-in="f.name" maxlength="30" value="' + esc(f.name) + '" placeholder="例)男子飲み会"></div>';
    h += '<div class="field"><label>種類</label><div class="kinds">' + kinds.slice(0, 2).map(function (k) {
      return '<button class="kind' + (f.kind === k[0] ? ' on' : '') + '" data-act="setKind" data-v="' + k[0] + '"><b>' + k[0] + '</b><span>' + k[1] + '</span></button>'; }).join('') + '</div>' +
      '<div class="hint">1回きりのイベントは、一覧の「1回きりのイベントを作る」から作ります</div></div>';
    h += '<div class="field"><label>つなぼる(キャラクター)</label><div class="seg"><button class="' + (f.mascot ? 'on' : '') + '" data-act="setMascot" data-v="1">出す</button><button class="' + (!f.mascot ? 'on' : '') + '" data-act="setMascot" data-v="0">出さない</button></div></div>';
    if (S.err) h += '<div class="err">' + esc(S.err) + '</div>';
    h += '<button class="btn" data-act="createGroup"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '作っています…(ファイルを作るので少しかかります)' : '作る') + '</button></div>';
    return h;
  }

  function viewGroup() {
    var d = S.group, g = d.group;
    var h = '<div class="top"><div class="grow"><div class="crumb"><button data-act="home">一覧</button> ›</div><h1>' + esc(g.name) + ' <span class="badge">' + esc(g.kind) + '</span></h1></div>' +
      '<button class="btn ghost" data-act="showLink" data-link="' + esc(g.link) + '" data-title="' + esc(g.name) + 'のリンク">リンク・QR</button>' +
      '<button class="btn" data-act="newEvent">イベントを作る</button></div>';
    h += '<div class="cols"><div><h2 style="margin-top:0">イベント</h2>';
    if (!d.events.length) h += '<div class="card">まだイベントがありません。</div>';
    d.events.slice().reverse().forEach(function (e) {
      h += '<button class="card evline" style="margin-bottom:8px" data-act="openEvent" data-g="' + esc(g.id) + '" data-id="' + esc(e.id) + '"><span class="grow"><b>' + esc(e.name) + '</b>' +
        '<div class="sub">候補 ' + e.candidates.filter(function (c) { return c.stage !== 'time'; }).length + '日' + (e.deadline ? ' ・ 締め切り ' + fmtDate(e.deadline) : '') + '</div></span>' + badge(e.status) + '</button>';
    });
    h += '</div><div><h2 style="margin-top:0">メンバー(' + d.members.length + '人)</h2><div class="card" style="max-height:420px;overflow:auto">';
    // 二重に登録した人を消せるように(どちらを消すか分かるよう、答えたイベントの数も出す)
    d.members.forEach(function (m) {
      h += '<div class="row" style="padding:3px 0"><span class="grow">' + esc(m.name) + (m.grade ? ' <span class="sub">' + esc(m.grade) + '</span>' : '') +
        ' <span class="sub">答え ' + m.answered + '件</span></span>' +
        '<button class="btn ghost sm" data-act="removeMember" data-id="' + esc(m.memberId) + '" data-name="' + esc(m.name) + '" data-n="' + m.answered + '">削除</button></div>';
    });
    if ((d.removed || []).length) {
      h += '<details style="margin-top:8px"><summary class="sub" style="cursor:pointer">削除したメンバー(' + d.removed.length + '人)</summary>' +
        d.removed.map(function (m) {
          return '<div class="row" style="padding:3px 0"><span class="grow sub">' + esc(m.name) + ' ・ 答え ' + m.answered + '件</span>' +
            '<button class="btn ghost sm" data-act="restoreMember" data-id="' + esc(m.memberId) + '">戻す</button></div>'; }).join('') + '</details>';
    }
    h += '</div><h2>設定</h2><div class="card">' +
      '<div class="field" style="margin-top:0"><label>グループの名前</label><div class="row"><input data-in="groupName" maxlength="30" value="' + esc(S.groupName != null ? S.groupName : g.name) + '" style="flex:1;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px">' +
      '<button class="btn sm" data-act="renameGroup">保存</button></div><div class="hint">参加者の画面にも、新しい名前で出ます。リンクは変わりません</div></div>' +
      '<div class="row" style="margin-bottom:10px"><span class="grow">つなぼる</span><div class="seg">' +
      '<button class="' + (g.mascot ? 'on' : '') + '" data-act="groupMascot" data-v="1">出す</button><button class="' + (!g.mascot ? 'on' : '') + '" data-act="groupMascot" data-v="0">出さない</button></div></div>' +
      (g.kind === 'サークル' ? '<div class="row" style="margin-bottom:10px"><span class="grow">名簿の新しい人を足す</span><button class="btn ghost sm" data-act="syncRoster">読み直す</button></div>' : '') +
      '<div class="row"><span class="grow">一覧からしまう(ファイルは残る)</span><button class="btn danger sm" data-act="archiveGroup">しまう</button></div></div></div></div>';
    return h;
  }

  // ---- イベントを作る ----
  function viewNewEvent() {
    var f = S.form;
    var title = f.once ? '1回きりのイベントを作る' : (esc(S.group.group.name) + 'にイベントを作る');
    var h = '<div class="top"><div class="grow"><div class="crumb"><button data-act="' + (f.once ? 'home' : 'backGroup') + '">戻る</button> ›</div><h1>' + title + '</h1></div></div>';
    h += '<div class="cols"><div class="card"><h2 style="margin-top:0">候補日</h2>' + calendar() +
      '<div class="row" style="margin-top:10px;flex-wrap:wrap"><span class="sub">時刻(まとめて)</span><input type="time" data-in="f.defTime" value="' + esc(f.defTime) + '" style="padding:5px 8px;border:1.5px solid var(--line);border-radius:8px">' +
      '<button class="btn ghost sm" data-act="applyTime">全部にあてる</button><span class="sub" style="margin-left:8px">毎週</span><select data-in="f.wd" style="padding:5px;border:1.5px solid var(--line);border-radius:8px">' +
      WD.map(function (w, i) { return '<option value="' + i + '"' + (+f.wd === i ? ' selected' : '') + '>' + w + '曜</option>'; }).join('') + '</select>' +
      '<select data-in="f.weeks" style="padding:5px;border:1.5px solid var(--line);border-radius:8px">' + [2, 3, 4, 6, 8].map(function (n) { return '<option' + (+f.weeks === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select><span class="sub">週分</span>' +
      '<button class="btn ghost sm" data-act="addWeekly">足す</button></div>';
    h += '<div class="picked">' + (f.cands.length ? f.cands.map(function (c, i) {
      return '<span class="pick">' + fmtDate(c.date) + '<input type="time" data-in="c.time" data-i="' + i + '" value="' + esc(c.time) + '"><button data-act="dupDay" data-i="' + i + '" title="この日に別の時間を足す">＋時間</button><button data-act="unpick" data-i="' + i + '">✕</button></span>'; }).join('') : '<span class="sub">カレンダーで日付をクリックして選んでください</span>') + '</div></div>';
    h += '<div class="card">' + eventFields(f) + (S.err ? '<div class="err">' + esc(S.err) + '</div>' : '') +
      '<button class="btn" style="width:100%;margin-top:8px" data-act="createEvent"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '作っています…' : '作ってリンクを出す') + '</button></div></div>';
    return h;
  }

  function eventFields(f) {
    return '<div class="field"><label>イベントの名前</label><input data-in="f.name" maxlength="40" value="' + esc(f.name) + '" placeholder="例)忘年会の日程"></div>' +
      '<div class="field"><label>説明(なくてもOK)</label><textarea data-in="f.description" maxlength="300">' + esc(f.description) + '</textarea></div>' +
      '<div class="two"><div class="field"><label>場所(決まっていれば)</label><input data-in="f.place" value="' + esc(f.place) + '"></div>' +
      '<div class="field"><label>お金の目安(決まっていれば)</label><input data-in="f.cost" value="' + esc(f.cost) + '" placeholder="例)3000〜4000円"></div></div>' +
      '<div class="field"><label>リンク(お店のページなど)</label><input data-in="f.url" value="' + esc(f.url) + '" placeholder="https://"></div>' +
      '<div class="two"><div class="field"><label>締め切り(なくてもOK)</label><input type="date" data-in="f.deadline" value="' + esc(f.deadline) + '"></div>' +
      '<div class="field"><label>結果の見せ方</label><select data-in="f.visibility">' + [['名前', '名前も見せる'], ['人数', '人数だけ'], ['伊吹だけ', '見せない(自分だけ)']].map(function (v) {
        return '<option value="' + v[0] + '"' + (f.visibility === v[0] ? ' selected' : '') + '>' + v[1] + '</option>'; }).join('') + '</select>' +
      '<div class="hint">大人数のイベントは「人数だけ」がおすすめ</div></div></div>';
  }

  function calendar() {
    var f = S.form, base = new Date(f.calY, f.calM, 1), today = ymd(new Date());
    var picked = {};
    f.cands.forEach(function (c) { picked[c.date] = true; });
    var h = '<div class="cal"><div class="head"><button class="btn ghost sm" data-act="calPrev">‹</button><b>' + f.calY + '年' + (f.calM + 1) + '月</b><button class="btn ghost sm" data-act="calNext">›</button></div><table><tr>' +
      WD.map(function (w, i) { return '<th class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</th>'; }).join('') + '</tr><tr>';
    for (var i = 0; i < base.getDay(); i++) h += '<td></td>';
    var days = new Date(f.calY, f.calM + 1, 0).getDate();
    for (var d = 1; d <= days; d++) {
      var dt = new Date(f.calY, f.calM, d), s = ymd(dt), wd = dt.getDay();
      if (wd === 0 && d !== 1) h += '</tr><tr>';
      h += '<td><button class="d' + (picked[s] ? ' on' : '') + (s < today ? ' past' : '') + ' ' + (wd === 0 ? 'sun' : wd === 6 ? 'sat' : '') + '" data-act="pickDay" data-d="' + s + '"' + (s < today ? ' disabled' : '') + '>' + d + '</button></td>';
    }
    return h + '</tr></table></div>';
  }

  // ---- 結果 ----
  function viewEvent() {
    var r = S.res, ev = r.event, g = S.group.group;
    var h = '<div class="top"><div class="grow"><div class="crumb"><button data-act="home">一覧</button> › <button data-act="backGroup">' + esc(g.name) + '</button> ›</div>' +
      '<h1>' + esc(ev.name) + ' ' + badge(ev.status) + '</h1><div class="sub">' + (ev.deadline ? '締め切り ' + fmtDate(ev.deadline) + ' ・ ' : '') +
      '結果の見せ方:' + esc(ev.visibility === '伊吹だけ' ? '見せない' : ev.visibility === '人数' ? '人数だけ' : '名前も見せる') + '</div></div>' +
      '<button class="btn ghost" data-act="showLink" data-link="' + esc(ev.link) + '" data-title="' + esc(ev.name) + 'のリンク">リンク・QR</button>' +
      '<button class="btn ghost" data-act="refresh">最新にする</button>' +
      '<button class="btn ghost" data-act="editEvent">変更</button><button class="btn danger" data-act="deleteEvent">削除</button></div>';
    h += '<div class="cols"><div>';
    // 出欠
    if (r.attendance) {
      var a = r.attendance;
      var dec = ev.candidates.filter(function (c) { return c.id === ev.decidedId; })[0];
      var timeDecided = dec && dec.stage === 'time';
      h += '<div class="card" style="margin-bottom:12px"><div class="row"><div class="grow"><div class="sub">決まった日</div><div class="date" style="font-size:20px">' + (dec ? fmtDate(dec.date) + (dec.time ? ' ' + esc(dec.time) : '') : '') + '</div></div>' +
        (ev.status === '出欠確認中' ? '<button class="btn ghost sm" data-act="undecide">' + (timeDecided ? '時間の調整に戻す' : '日程調整に戻す') + '</button><button class="btn ghost sm" data-act="closeEvent">終了にする</button>' : '') + '</div>' +
        '<div class="cnt" style="margin-top:8px"><span class="o">行く ' + a.totals.go + '</span><span class="t">途中から ' + a.totals.partial + '</span><span class="x">行かない ' + a.totals.no + '</span></div>' +
        '<table class="grid2" style="margin-top:8px"><tr><th>名前</th><th>出欠</th><th>来られる時間</th><th>ひとこと</th></tr>' +
        a.rows.map(function (x) {
          if (!x.status) return ''; // 答えていない人は出さない(名指ししない)
          return '<tr><td>' + esc(x.name) + '</td><td><select data-in="attSel" data-m="' + esc(x.memberId) + '">' + ['', '行く', '途中から', '行かない'].map(function (v) {
            return '<option' + (x.status === v ? ' selected' : '') + ' value="' + v + '">' + (v || '—') + '</option>'; }).join('') + '</select></td><td>' + esc(x.arriveAt) + '</td><td style="text-align:left">' + esc(x.comment) + '</td></tr>';
        }).join('') + '</table></div>';
      if (r.dateStage && r.dateStage.timeStage) {
        h += '<details><summary class="sub" style="cursor:pointer;margin:6px 0">時間の調整のときの結果</summary>' +
          r.dateStage.timeStage.byDate.map(function (b) { return resCard(b, r.memberCount, '', true); }).join('') + '</details>';
      }
      h += '<details><summary class="sub" style="cursor:pointer;margin:6px 0">日程調整のときの結果</summary>';
    }
    var isTime = ev.status === '時間調整中';
    if (isTime) {
      var dd = ev.candidates.filter(function (c) { return c.id === ev.decidedId; })[0];
      h += '<div class="card" style="margin-bottom:12px"><div class="row"><div class="grow"><div class="sub">決まった日(いま時間を聞いています)</div><div class="date" style="font-size:20px">' + (dd ? fmtDate(dd.date) : '') + '</div></div>' +
        '<button class="btn ghost sm" data-act="undecide">日程調整に戻す</button></div></div>';
    }
    if (S.group.group.kind === 'サークル') {
      h += '<div class="row" style="margin-bottom:10px"><span class="sub">絞り込み</span>' +
        '<select data-in="fGrade">' + ['', '1年', '2年', '3年', '4年'].map(function (v) { return '<option value="' + v + '"' + ((S.filter.grade || '') === v ? ' selected' : '') + '>' + (v || '全学年') + '</option>'; }).join('') + '</select>' +
        '<select data-in="fGender">' + ['', '男性', '女性'].map(function (v) { return '<option value="' + v + '"' + ((S.filter.gender || '') === v ? ' selected' : '') + '>' + (v || '男女とも') + '</option>'; }).join('') + '</select>' +
        '<span class="sub">回答 ' + r.answeredCount + '人</span></div>';
    } else h += '<div class="sub" style="margin-bottom:10px">回答 ' + r.answeredCount + '人</div>';
    r.byDate.forEach(function (b) {
      var act = S.candEdit ? '<label class="btn ghost sm"><input type="checkbox" data-in="candChk" value="' + esc(b.candidateId) + '"' + (S.candEdit[b.candidateId] ? ' checked' : '') + '> 消す</label>'
        : ev.status === '日程調整中' ? '<button class="btn green sm" data-act="decide" data-c="' + esc(b.candidateId) + '">この日に決める</button>'
        : isTime ? '<button class="btn green sm" data-act="decideTime" data-c="' + esc(b.candidateId) + '">この時間に決める</button>' : '';
      h += resCard(b, r.memberCount, act, isTime);
    });
    if (S.candEdit) {
      var nSel = Object.keys(S.candEdit).filter(function (k) { return S.candEdit[k]; }).length;
      h += '<div class="row"><button class="btn danger sm" data-act="removeSelected"' + (nSel ? '' : ' disabled') + '>選んだ' + nSel + 'つを消す</button><button class="btn ghost sm" data-act="candEditOff">やめる</button></div>';
    } else if (ev.status === '日程調整中') {
      h += '<div class="row"><button class="btn ghost sm" data-act="addCand">候補日を足す</button><button class="btn ghost sm" data-act="candEditOn">候補日を消す</button></div>';
    } else if (isTime) {
      h += '<div class="row"><button class="btn ghost sm" data-act="addTimes">時間の候補を足す</button><button class="btn ghost sm" data-act="candEditOn">時間の候補を消す</button></div>';
    }
    if (r.attendance) h += '</details>';
    if (isTime && r.dateStage) {
      h += '<details><summary class="sub" style="cursor:pointer;margin:6px 0">日程調整のときの結果</summary>' +
        r.dateStage.byDate.map(function (b) { return resCard(b, r.memberCount, '', false); }).join('') + '</details>';
    }
    h += '</div><div>';
    // 右側:ひとこと・来てほしい人・代わりに入れる(LINEに流す文は11/28にやめた。リンクは上の「リンク・QR」から)
    if (r.comments.length) h += '<h2>ひとこと</h2><div class="card">' + r.comments.map(function (c) { return '<div><b>' + esc(c.name) + '</b>:' + esc(c.comment) + '</div>'; }).join('') + '</div>';
    h += '<h2>そのほか</h2><div class="card"><div class="row" style="margin-bottom:8px"><span class="grow">来てほしい人(' + r.wanted.length + '人)</span><button class="btn ghost sm" data-act="editWanted">選ぶ</button></div>' +
      '<div class="row"><span class="grow">LINEなどで聞いた答えを代わりに入れる</span><button class="btn ghost sm" data-act="proxy">入れる</button></div></div>';
    return h + '</div></div>';
  }

  /** 候補1つぶんの結果カード。timeOnly=true なら時刻を大きく出す(時間の候補) */
  function resCard(b, memberCount, act, timeOnly) {
    var total = Math.max(1, memberCount);
    var head = timeOnly ? esc(b.time || '時間未定') + ' <span class="sub">' + fmtDate(b.date) + '</span>'
      : fmtDate(b.date) + (b.time ? ' <span class="sub">' + esc(b.time) + '</span>' : '');
    return '<div class="card res' + (b.best ? ' best' : '') + '">' + (b.best ? '<div class="crown">' + (timeOnly ? 'いちばん多い時間' : 'いちばん多い日') + '</div>' : '') +
      '<div class="row"><div class="grow date">' + head + (b.memo ? ' <span class="sub">' + esc(b.memo) + '</span>' : '') + '</div>' +
      '<span class="cnt"><span class="o">○' + b.o + '</span><span class="t">△' + b.t + '</span><span class="x">×' + b.x + '</span></span>' + (act || '') + '</div>' +
      '<div class="bar"><i style="width:' + (b.o / total * 100) + '%;background:var(--o)"></i><i style="width:' + (b.t / total * 100) + '%;background:var(--t)"></i><i style="width:' + (b.x / total * 100) + '%;background:var(--x)"></i></div>' +
      '<div class="names">' + [['○', 'o'], ['△', 't'], ['×', 'x']].map(function (m) {
        var list = (b.names && b.names[m[1]]) || []; return list.length ? '<div><span class="lab ' + m[1] + '">' + m[0] + '</span>' + list.map(esc).join('・') + '</div>' : ''; }).join('') + '</div>' +
      (b.wanted ? '<div class="wanted">来てほしい人:' + (b.wanted.ok.length ? '<b style="color:var(--o)">○ ' + b.wanted.ok.map(esc).join('・') + '</b> ' : '') +
        (b.wanted.maybe.length ? '<span style="color:var(--t-ink)">△ ' + b.wanted.maybe.map(esc).join('・') + '</span> ' : '') +
        (b.wanted.ng.length ? '<span style="color:var(--danger)">× ' + b.wanted.ng.map(esc).join('・') + '</span> ' : '') +
        (b.wanted.none.length ? '<span class="sub">未回答 ' + b.wanted.none.map(esc).join('・') + '</span>' : '') + '</div>' : '') + '</div>';
  }

  function timeInputs(list) {
    return '<div class="picked">' + list.map(function (t, i) {
      return '<span class="pick"><input type="time" data-in="mTime" data-i="' + i + '" value="' + esc(t) + '"><button data-act="mTimeDel" data-i="' + i + '">✕</button></span>'; }).join('') +
      '<button class="btn ghost sm" data-act="mTimeAdd">＋時間</button></div>';
  }

  /** いまの段階の候補(代わりに入れる表に使う) */
  function stageCands() {
    var ev = S.res.event, t = ev.status === '時間調整中';
    return ev.candidates.filter(function (c) { return (c.stage === 'time') === t; });
  }

  // ---- モーダル ----
  function viewModal() {
    var m = S.modal;
    if (m.type === 'decide') {
      return '<h2 style="margin-top:0">' + fmtDate(m.date) + ' に決める</h2>' +
        '<div class="kinds" style="margin-top:10px">' +
        '<button class="kind' + (!m.askTime ? ' on' : '') + '" data-act="decideMode" data-v="0"><b>そのまま出欠確認に進む</b><span>' + (m.time ? esc(m.time) + ' からで決まり。' : '') + '○の人は「行く」、×の人は「行かない」が仮に入ります</span></button>' +
        '<button class="kind' + (m.askTime ? ' on' : '') + '" data-act="decideMode" data-v="1"><b>時間も聞く</b><span>同じリンクで「何時からがいい?」を聞きます。時間が決まったら出欠確認に進みます</span></button></div>' +
        (m.askTime ? '<div class="field"><label>時間の候補</label>' + timeInputs(m.times) + '</div>' : '') +
        '<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-act="closeModal">やめる</button><button class="btn green" data-act="saveDecide">決める</button></div>';
    }
    if (m.type === 'addTimes') {
      return '<h2 style="margin-top:0">時間の候補を足す</h2>' + timeInputs(m.times) +
        '<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-act="closeModal">やめる</button><button class="btn" data-act="saveTimes">足す</button></div>';
    }
    if (m.type === 'link') {
      return '<h2 style="margin-top:0">' + esc(m.title) + '</h2><div class="linkbox"><input readonly value="' + esc(m.link) + '"><button class="btn sm" data-act="copyLink">コピー</button></div>' +
        '<div class="qr" style="margin-top:14px"><img src="' + qrImg(m.link) + '" alt="QRコード"><div class="sub">画面で見せて読み込んでもらう用</div></div>' +
        '<div style="text-align:right;margin-top:10px"><button class="btn ghost" data-act="closeModal">閉じる</button></div>';
    }
    if (m.type === 'edit') {
      return '<h2 style="margin-top:0">イベントを変更</h2>' + eventFields(S.form) +
        '<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-act="closeModal">やめる</button><button class="btn" data-act="saveEdit">保存</button></div>';
    }
    if (m.type === 'wanted') {
      return '<h2 style="margin-top:0">来てほしい人</h2><div class="sub">選んだ人が来られるかを、日ごとの結果に出します</div><div style="columns:2;margin-top:10px">' +
        S.group.members.map(function (x) { return '<label style="display:block;padding:3px 0"><input type="checkbox" data-in="wantedChk" value="' + esc(x.memberId) + '"' + (m.sel[x.memberId] ? ' checked' : '') + '> ' + esc(x.name) + '</label>'; }).join('') +
        '</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-act="closeModal">やめる</button><button class="btn" data-act="saveWanted">保存</button></div>';
    }
    if (m.type === 'proxy') {
      var cands = stageCands();
      return '<h2 style="margin-top:0">代わりに入れる</h2><div class="sub">締め切り後でも入れられます。押すと切りかわり、「保存」でまとめて送ります</div>' +
        '<table class="grid2" style="margin-top:10px"><tr><th>名前</th>' + cands.map(function (c) { return '<th>' + (c.stage === 'time' ? esc(c.time) : fmtDate(c.date) + (c.time ? '<br><span class="sub">' + esc(c.time) + '</span>' : '')) + '</th>'; }).join('') + '</tr>' +
        S.res.answersByMember.map(function (x) {
          return '<tr><td>' + esc(x.name) + '</td>' + cands.map(function (c) {
            var v = (m.edit[x.memberId] || x.answers)[c.id] || '';
            var cls = v === '○' ? 'o' : v === '△' ? 't' : v === '×' ? 'x' : '';
            return '<td><button class="mk ' + cls + (v ? ' on' : '') + '" data-act="cycle" data-m="' + esc(x.memberId) + '" data-c="' + esc(c.id) + '">' + (v || '·') + '</button></td>';
          }).join('') + '</tr>';
        }).join('') + '</table><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-act="closeModal">やめる</button><button class="btn" data-act="saveProxy">保存</button></div>';
    }
    if (m.type === 'rename') {
      return '<h2 style="margin-top:0">グループの名前を変える</h2>' +
        '<div class="field"><input data-in="renameVal" maxlength="30" value="' + esc(m.value) + '"></div>' +
        '<div class="hint">参加者の画面にも新しい名前で出ます。リンクは変わりません</div>' +
        '<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-act="closeModal">やめる</button><button class="btn" data-act="saveRename">保存</button></div>';
    }
    if (m.type === 'addCand') {
      return '<h2 style="margin-top:0">候補日を足す</h2>' + calendar() + '<div class="picked">' + S.form.cands.map(function (c, i) {
        return '<span class="pick">' + fmtDate(c.date) + '<input type="time" data-in="c.time" data-i="' + i + '" value="' + esc(c.time) + '"><button data-act="dupDay" data-i="' + i + '" title="この日に別の時間を足す">＋時間</button><button data-act="unpick" data-i="' + i + '">✕</button></span>'; }).join('') + '</div>' +
        '<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-act="closeModal">やめる</button><button class="btn" data-act="saveCands">足す</button></div>';
    }
    return '';
  }

  // ===== 操作 =====
  function newForm(extra) {
    var now = new Date();
    return Object.assign({ name: '', description: '', place: '', cost: '', url: '', deadline: '', visibility: '名前', cands: [], defTime: '19:00',
      calY: now.getFullYear(), calM: now.getMonth(), wd: 2, weeks: 4, kind: 'グループ', mascot: true }, extra || {});
  }
  function eventInput(f) {
    return { name: f.name, description: f.description, place: f.place, cost: f.cost, url: f.url, deadline: f.deadline, visibility: f.visibility };
  }
  var ACTIONS = {
    login: function () {
      S.busy = true; S.err = ''; render();
      google.script.run.withSuccessHandler(function (res) {
        S.busy = false;
        if (res.ok) { S.token = res.data.token; lsSet('sch.admin', S.token); loadHome(); } else { S.err = res.error.message; render(); }
      }).withFailureHandler(function () { S.busy = false; S.err = '通信できませんでした'; render(); }).adminLogin(S.pw || '');
    },
    home: function () { loadHome(); },
    moveOpen: function () { call('adminGetMove').then(function (d) { S.move = d; render(); }).catch(fail); },
    moveSet: function (el) {
      var v = el.getAttribute('data-v');
      var msg = v === 'moving' ? '引っ越し中にしますか?参加者は答えを送れなくなります(「少し待ってね」と出ます)' : 'ふつうに戻しますか?参加者はまたこのアプリで答えられるようになります';
      if (!window.confirm(msg)) return;
      call('adminSetMove', [v, {}]).then(function (d) { S.move = d; toast(v === 'moving' ? '引っ越し中にしました' : 'ふつうに戻しました'); render(); }).catch(fail);
    },
    moveExport: function () {
      if (S.move && S.move.mode !== 'moving' && !window.confirm('まだ「引っ越し中」になっていません。このまま書き出すと、このあと答えた人の分は移りません。書き出しますか?')) return;
      toast('書き出しています…');
      call('adminExportForB').then(function (d) {
        S.moveExport = JSON.stringify(d);
        try {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([S.moveExport], { type: 'application/json' }));
          a.download = 'a-export.json'; document.body.appendChild(a); a.click(); a.remove();
        } catch (e) { /* 保存できない場合は下の中身をコピーしてもらう */ }
        var n = d.groups.reduce(function (s, g) { return s + g.members.length; }, 0);
        toast('書き出しました(グループ ' + d.groups.length + '・メンバー ' + n + '人)'); render();
      }).catch(fail);
    },
    moveCopy: function () { copy(S.moveExport || ''); },
    moveDone: function () {
      var links;
      try { links = JSON.parse(S.moveLinks || ''); } catch (e) { toast('貼った中身の形が正しくありません'); return; }
      if (!window.confirm('「引っ越しました」にしますか?参加者には新しいリンクが出て、このアプリでは答えられなくなります')) return;
      call('adminSetMove', ['moved', links]).then(function (d) { S.move = d; toast('「引っ越しました」にしました'); render(); }).catch(fail);
    },
    newGroup: function () { S.form = newForm(); S.err = ''; S.view = 'newGroup'; render(); },
    newOnce: function () { S.form = newForm({ once: true, mascot: false }); S.err = ''; S.view = 'newEvent'; render(); },
    setKind: function (el) { S.form.kind = el.getAttribute('data-v'); render(); },
    setMascot: function (el) { S.form.mascot = el.getAttribute('data-v') === '1'; render(); },
    createGroup: function () {
      if (!S.form.name.trim()) { S.err = '名前を入れてください'; render(); return; }
      S.busy = true; render();
      call('adminCreateGroup', [{ name: S.form.name, kind: S.form.kind, mascot: S.form.mascot }]).then(function (d) {
        S.busy = false; toast('作りました'); S.modal = { type: 'link', link: d.link, title: S.form.name + 'のリンク' }; loadGroup(d.groupId);
      }).catch(fail);
    },
    openGroup: function (el) { S.groupName = null; loadGroup(el.getAttribute('data-id')); },
    backGroup: function () { loadGroup(S.group.group.id); },
    openEvent: function (el) { S.filter = {}; S.remind = null; S.candEdit = null; loadEvent(el.getAttribute('data-g'), el.getAttribute('data-id')); },
    refresh: function () { refresh(false); },
    candEditOn: function () { S.candEdit = {}; render(); },
    candEditOff: function () { S.candEdit = null; render(); },
    removeSelected: function () {
      var ids = Object.keys(S.candEdit).filter(function (k) { return S.candEdit[k]; });
      if (!ids.length || !confirm('選んだ' + ids.length + 'つの候補日を消しますか?(その日への答えも集計に出なくなります)')) return;
      call('adminRemoveCandidates', [S.group.group.id, S.res.event.id, ids]).then(function () {
        S.candEdit = null; toast('消しました'); loadEvent(S.group.group.id, S.res.event.id, true);
      }).catch(fail);
    },
    deleteEvent: function () {
      var ev = S.res.event;
      if (!confirm('「' + ev.name + '」を削除しますか?\n候補日・みんなの答え・出欠もすべて消えて、元に戻せません。')) return;
      var gid = S.group.group.id, once = S.group.group.kind === '1回きり';
      call('adminDeleteEvent', [gid, ev.id]).then(function () {
        toast('削除しました'); S.res = null;
        if (once) loadHome(); else loadGroup(gid);
      }).catch(fail);
    },
    newEvent: function () { S.form = newForm(); S.err = ''; S.view = 'newEvent'; render(); },
    calPrev: function () { var f = S.form; f.calM--; if (f.calM < 0) { f.calM = 11; f.calY--; } render(); },
    calNext: function () { var f = S.form; f.calM++; if (f.calM > 11) { f.calM = 0; f.calY++; } render(); },
    pickDay: function (el) {
      var d = el.getAttribute('data-d'), f = S.form;
      var i = f.cands.map(function (c) { return c.date; }).indexOf(d);
      if (i >= 0) f.cands = f.cands.filter(function (c) { return c.date !== d; }); else f.cands.push({ date: d, time: f.defTime });
      f.cands.sort(function (a, b) { return a.date < b.date ? -1 : 1; }); render();
    },
    // 同じ日に別の時間の候補を足す(例:12/15 の 18:00 と 20:00)
    dupDay: function (el) {
      var i = +el.getAttribute('data-i'), c = S.form.cands[i];
      S.form.cands.splice(i + 1, 0, { date: c.date, time: '' });
      render();
      var inp = app.querySelector('[data-in="c.time"][data-i="' + (i + 1) + '"]'); if (inp) inp.focus();
    },
    unpick: function (el) { S.form.cands.splice(+el.getAttribute('data-i'), 1); render(); },
    applyTime: function () {
      // 同じ日に時間を複数入れた日は、そのまま残す
      var n = {}; S.form.cands.forEach(function (c) { n[c.date] = (n[c.date] || 0) + 1; });
      S.form.cands.forEach(function (c) { if (n[c.date] === 1) c.time = S.form.defTime; }); render();
    },
    addWeekly: function () {
      var f = S.form, start = new Date(), have = {};
      f.cands.forEach(function (c) { have[c.date] = true; });
      for (var i = 0; i < f.weeks * 7; i++) {
        var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        if (d.getDay() === +f.wd && !have[ymd(d)]) f.cands.push({ date: ymd(d), time: f.defTime });
      }
      f.cands.sort(function (a, b) { return a.date < b.date ? -1 : 1; }); render();
    },
    createEvent: function () {
      var f = S.form;
      if (!f.name.trim()) { S.err = 'イベントの名前を入れてください'; render(); return; }
      if (!f.cands.length) { S.err = '候補日を選んでください'; render(); return; }
      S.busy = true; S.err = ''; render();
      var gid = f.once ? '' : S.group.group.id;
      call('adminCreateEvent', [gid, Object.assign(eventInput(f), { candidates: f.cands, mascot: f.mascot })]).then(function (d) {
        S.busy = false; toast('作りました'); S.group = null;
        S.modal = { type: 'link', link: d.link, title: f.name + 'のリンク' };
        loadEvent(d.groupId, d.eventId);
      }).catch(fail);
    },
    showLink: function (el) { S.modal = { type: 'link', link: el.getAttribute('data-link'), title: el.getAttribute('data-title') }; render(); },
    copyLink: function () { copy(S.modal.link); },
    closeModal: function () { S.modal = null; render(); },
    decide: function (el) {
      var c = S.res.event.candidates.filter(function (x) { return x.id === el.getAttribute('data-c'); })[0];
      if (!c) return;
      S.modal = { type: 'decide', candId: c.id, date: c.date, time: c.time, askTime: false, times: [c.time || '18:00', ''] }; render();
    },
    decideMode: function (el) { S.modal.askTime = el.getAttribute('data-v') === '1'; render(); },
    mTimeAdd: function () { S.modal.times.push(''); render(); },
    mTimeDel: function (el) { S.modal.times.splice(+el.getAttribute('data-i'), 1); render(); },
    saveDecide: function () {
      var m = S.modal, times = m.times.filter(Boolean);
      if (m.askTime && !times.length) { toast('時間の候補を1つ以上入れてください'); return; }
      call('adminDecide', [S.group.group.id, S.res.event.id, m.candId, { askTime: m.askTime, times: times }]).then(function () {
        S.modal = null; S.remind = null; toast(m.askTime ? '時間を聞く形にしました' : '決めました'); loadEvent(S.group.group.id, S.res.event.id, true);
      }).catch(fail);
    },
    decideTime: function (el) {
      if (!confirm('この時間に決めて、出欠確認に切りかえますか?(○の人は「行く」、×の人は「行かない」が仮に入ります)')) return;
      call('adminDecideTime', [S.group.group.id, S.res.event.id, el.getAttribute('data-c')]).then(function () { S.remind = null; toast('決めました'); loadEvent(S.group.group.id, S.res.event.id, true); }).catch(fail);
    },
    addTimes: function () { S.modal = { type: 'addTimes', times: [''] }; render(); },
    saveTimes: function () {
      var times = S.modal.times.filter(Boolean);
      if (!times.length) { S.modal = null; render(); return; }
      var d = S.res.event.candidates.filter(function (c) { return c.id === S.res.event.decidedId; })[0];
      call('adminAddCandidates', [S.group.group.id, S.res.event.id, times.map(function (t) { return { date: d ? d.date : '', time: t }; })]).then(function () { S.modal = null; toast('足しました'); loadEvent(S.group.group.id, S.res.event.id, true); }).catch(fail);
    },
    undecide: function () {
      var ev = S.res.event, dec = ev.candidates.filter(function (c) { return c.id === ev.decidedId; })[0];
      var msg = ev.status === '時間調整中' ? '日程調整に戻しますか?(時間の候補は消えます)'
        : dec && dec.stage === 'time' ? '時間の調整に戻しますか?(出欠の答えは残ります)' : '日程調整に戻しますか?(出欠の答えは残ります)';
      if (!confirm(msg)) return;
      S.remind = null;
      call('adminUndecide', [S.group.group.id, S.res.event.id]).then(function () { loadEvent(S.group.group.id, S.res.event.id, true); }).catch(fail);
    },
    closeEvent: function () {
      if (!confirm('終了にしますか?(参加者は答えを変えられなくなります)')) return;
      call('adminCloseEvent', [S.group.group.id, S.res.event.id]).then(function () { loadEvent(S.group.group.id, S.res.event.id, true); }).catch(fail);
    },
    removeCand: function (el) {
      if (!confirm('この候補日を消しますか?')) return;
      call('adminRemoveCandidate', [S.group.group.id, S.res.event.id, el.getAttribute('data-c')]).then(function () { loadEvent(S.group.group.id, S.res.event.id, true); }).catch(fail);
    },
    addCand: function () { S.form = newForm(); S.modal = { type: 'addCand' }; render(); },
    saveCands: function () {
      if (!S.form.cands.length) { S.modal = null; render(); return; }
      call('adminAddCandidates', [S.group.group.id, S.res.event.id, S.form.cands]).then(function () { S.modal = null; toast('足しました'); loadEvent(S.group.group.id, S.res.event.id, true); }).catch(fail);
    },
    editEvent: function () {
      var e = S.res.event;
      S.form = newForm({ name: e.name, description: e.description, place: e.place, cost: e.cost, url: e.url, deadline: e.deadline, visibility: e.visibility });
      S.modal = { type: 'edit' }; render();
    },
    saveEdit: function () {
      call('adminUpdateEvent', [S.group.group.id, S.res.event.id, eventInput(S.form)]).then(function () { S.modal = null; toast('保存しました'); loadEvent(S.group.group.id, S.res.event.id, true); }).catch(fail);
    },
    editWanted: function () { var sel = {}; S.res.wanted.forEach(function (id) { sel[id] = true; }); S.modal = { type: 'wanted', sel: sel }; render(); },
    saveWanted: function () {
      var ids = Object.keys(S.modal.sel).filter(function (k) { return S.modal.sel[k]; });
      call('adminSetWanted', [S.group.group.id, S.res.event.id, ids]).then(function () { S.modal = null; loadEvent(S.group.group.id, S.res.event.id, true); }).catch(fail);
    },
    proxy: function () { S.modal = { type: 'proxy', edit: {} }; render(); },
    cycle: function (el) {
      var mid = el.getAttribute('data-m'), cid = el.getAttribute('data-c');
      var base = S.res.answersByMember.filter(function (x) { return x.memberId === mid; })[0];
      var e = S.modal.edit[mid] || (S.modal.edit[mid] = Object.assign({}, base.answers));
      var order = ['', '○', '△', '×'];
      e[cid] = order[(order.indexOf(e[cid] || '') + 1) % 4];
      render();
    },
    saveProxy: function () {
      var ids = Object.keys(S.modal.edit);
      var gid = S.group.group.id, eid = S.res.event.id;
      ids.reduce(function (p, mid) { return p.then(function () { return call('adminSetAnswer', [gid, eid, mid, S.modal.edit[mid], null]); }); }, Promise.resolve()) // null = ひとことはそのまま
        .then(function () { S.modal = null; toast('保存しました'); loadEvent(gid, eid, true); }).catch(fail);
    },
    groupMascot: function (el) {
      var v = el.getAttribute('data-v') === '1';
      call('adminUpdateGroup', [S.group.group.id, { mascot: v }]).then(function () { S.group.group.mascot = v; render(); }).catch(fail);
    },
    renameFromList: function (el) { S.modal = { type: 'rename', id: el.getAttribute('data-id'), value: el.getAttribute('data-name') }; render(); },
    saveRename: function () {
      var m = S.modal, name = String(m.value || '').trim();
      if (!name) { toast('名前を入れてください'); return; }
      call('adminUpdateGroup', [m.id, { name: name }]).then(function () { S.modal = null; toast('名前を変えました'); loadHome(true); }).catch(fail);
    },
    renameGroup: function () {
      var name = (S.groupName != null ? S.groupName : S.group.group.name).trim();
      if (!name) { toast('名前を入れてください'); return; }
      call('adminUpdateGroup', [S.group.group.id, { name: name }]).then(function () {
        S.group.group.name = name; S.groupName = null; toast('名前を変えました'); render();
      }).catch(fail);
    },
    removeMember: function (el) {
      var name = el.getAttribute('data-name'), n = +el.getAttribute('data-n');
      if (!confirm('「' + name + '」をメンバーから削除しますか?\n' + (n ? 'この人の答え(' + n + '件)は集計に出なくなります。' : '') +
        '名前を選ぶ画面にも出なくなります。\nあとで「削除したメンバー」から戻せます。')) return;
      call('adminSetMemberActive', [S.group.group.id, el.getAttribute('data-id'), false]).then(function () { toast('削除しました'); loadGroup(S.group.group.id); }).catch(fail);
    },
    restoreMember: function (el) {
      call('adminSetMemberActive', [S.group.group.id, el.getAttribute('data-id'), true]).then(function () { toast('戻しました'); loadGroup(S.group.group.id); }).catch(fail);
    },
    syncRoster: function () { call('adminSyncRoster', [S.group.group.id]).then(function (d) { toast(d.added + '人を足しました'); loadGroup(S.group.group.id); }).catch(fail); },
    archiveGroup: function () {
      if (!confirm('このグループを一覧からしまいますか?(ファイルは残ります)')) return;
      call('adminArchiveGroup', [S.group.group.id]).then(function () { toast('しまいました'); loadHome(); }).catch(fail);
    }
  };
  var INPUTS = {
    moveLinks: function (v) { S.moveLinks = v; },
    pw: function (v) { S.pw = v; },
    remind: function (v) { S.remind = v; },
    groupName: function (v) { S.groupName = v; },
    renameVal: function (v) { S.modal.value = v; },
    fGrade: function (v) { S.filter.grade = v; loadEvent(S.group.group.id, S.res.event.id, true); },
    fGender: function (v) { S.filter.gender = v; loadEvent(S.group.group.id, S.res.event.id, true); },
    wantedChk: function (v, el) { S.modal.sel[el.value] = el.checked; },
    candChk: function (v, el) { S.candEdit[el.value] = el.checked; render(); },
    attSel: function (v, el) {
      if (!v) return;
      call('adminSetAttendance', [S.group.group.id, S.res.event.id, el.getAttribute('data-m'), { status: v }]).then(function () { toast('保存しました'); loadEvent(S.group.group.id, S.res.event.id, true); }).catch(fail);
    },
    'c.time': function (v, el) { S.form.cands[+el.getAttribute('data-i')].time = v; },
    mTime: function (v, el) { S.modal.times[+el.getAttribute('data-i')] = v; }
  };
  ['name', 'description', 'place', 'cost', 'url', 'deadline', 'visibility', 'defTime', 'wd', 'weeks'].forEach(function (k) { INPUTS['f.' + k] = function (v) { S.form[k] = v; }; });
  var CHANGE_ONLY = { fGrade: 1, fGender: 1, attSel: 1, wantedChk: 1, candChk: 1 };

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el && el.getAttribute('data-act') === 'closeModal' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) { e.preventDefault(); fn(el); }
  });
  app.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-in');
    if (k && INPUTS[k] && !CHANGE_ONLY[k]) INPUTS[k](e.target.value, e.target);
  });
  app.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-in');
    if (k && INPUTS[k] && (CHANGE_ONLY[k] || e.target.tagName === 'SELECT')) INPUTS[k](e.target.value, e.target);
  });
  app.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.getAttribute('data-in') === 'pw') ACTIONS.login(); });

  // ほかのタブやアプリから戻ってきたら、自動で読み直す(入力中・選択中は読み直さない)
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.token && !S.modal && !S.busy && !S.candEdit) refresh(true);
  });

  if (S.token) loadHome(); else { S.view = 'login'; render(); }
})();
</script>
